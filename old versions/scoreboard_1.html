<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d12;
    --panel: #10141b;
    --panel-hi: #161c26;
    --line: #232a36;
    --amber: #e0a83e;
    --amber-dim: #a67c2e;
    --text: #e8eaed;
    --text-dim: #7b8494;
    --live: #ef4444;
    --win: #4ade80;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    min-height: 100vh;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  /* Ribbon ticker header */
  .ticker-wrap{
    background: linear-gradient(180deg, #14181f, #0d1016);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    height: 34px;
    display:flex;
    align-items:center;
  }
  .ticker-wrap::before{
    content:"LIVE";
    position:absolute; left:0; top:0; bottom:0;
    background: var(--live);
    color:#fff;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing: 1px;
    display:flex; align-items:center;
    padding: 0 12px;
    z-index: 2;
  }
  .ticker-track{
    display:flex;
    gap:36px;
    padding-left: 70px;
    animation: scroll 45s linear infinite;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color: var(--text-dim);
  }
  .ticker-track span b{ color: var(--text); font-weight:600; }
  .ticker-wrap:hover .ticker-track{ animation-play-state: paused; }
  @keyframes scroll{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-50%); }
  }

  header.masthead{
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--line);
  }
  .masthead h1{
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .masthead .sub{
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 4px;
    font-family:'JetBrains Mono',monospace;
  }

  nav.tabs{
    display:flex;
    gap: 4px;
    padding: 12px 24px 0;
    border-bottom: 1px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    background: none;
    border: none;
    color: var(--text-dim);
    font-family:'Space Grotesk',sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.tabs button.active{
    color: var(--amber);
    border-bottom-color: var(--amber);
  }
  nav.tabs button:hover:not(.active){ color: var(--text); }

  main{ padding: 20px 24px 60px; max-width: 780px; margin: 0 auto; }
  .team-group-label{
    font-family:'JetBrains Mono',monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin: 4px 0 6px;
  }
  .section-label{
    font-family:'JetBrains Mono',monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--amber-dim);
    margin: 22px 0 10px;
    text-transform: uppercase;
  }
  .section-label:first-child{ margin-top: 0; }

  .game{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
  }
  .game.watch{ border-color: var(--amber-dim); background: var(--panel-hi); }
  .teams{ display:flex; flex-direction:column; gap: 6px; flex:1; min-width:0; }
  .team-row{ display:flex; align-items:center; justify-content:space-between; gap: 10px; }
  .team-name{ font-size: 14px; font-weight: 500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-name.fav::before{ content:"★ "; color: var(--amber); }
  .team-name.winner{ font-weight: 700; color: #fff; }
  .score{ font-family:'JetBrains Mono',monospace; font-size: 15px; font-weight:700; min-width: 28px; text-align:right; }
  .score.winner{ color: var(--win); }
  .meta{ text-align:right; flex-shrink:0; }
  .status{ font-family:'JetBrains Mono',monospace; font-size: 11px; color: var(--text-dim); white-space:nowrap; }
  .status.live{ color: var(--live); font-weight:700; }
  .status.live::before{ content:"● "; }
  .game-date{ font-family:'JetBrains Mono',monospace; font-size: 10px; color: var(--text-dim); margin-top: 3px; }
  .game{ cursor: pointer; }
  .game:hover{ border-color: var(--amber-dim); }

  /* Modal */
  .modal-backdrop{
    display:none;
    position: fixed; inset:0;
    background: rgba(5,7,10,0.75);
    z-index: 50;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 40px 16px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    max-width: 560px;
    width: 100%;
    padding: 22px;
  }
  .modal-close{
    float:right;
    background:none; border:none; color: var(--text-dim);
    font-size: 20px; cursor:pointer; line-height:1;
  }
  .modal-close:hover{ color: var(--text); }
  .modal h2{ font-size: 17px; margin-bottom: 4px; }
  .modal .venue{ font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--text-dim); margin-bottom: 18px; }
  .modal .modal-section-label{
    font-family:'JetBrains Mono',monospace; font-size: 10px; letter-spacing:1px;
    color: var(--amber-dim); text-transform:uppercase; margin: 18px 0 8px;
  }
  table.linescore{ width:100%; border-collapse: collapse; font-family:'JetBrains Mono',monospace; font-size:13px; }
  table.linescore th, table.linescore td{ padding: 6px 8px; text-align:center; border-bottom: 1px solid var(--line); }
  table.linescore td:first-child, table.linescore th:first-child{ text-align:left; }
  table.linescore th{ color: var(--text-dim); font-weight:500; }
  .play-item{ font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); color: var(--text-dim); }
  .play-item b{ color: var(--text); font-weight:600; }
  .leader-row{ display:flex; justify-content:space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .leader-row .lname{ font-weight:500; }
  .leader-row .lstat{ font-family:'JetBrains Mono',monospace; color: var(--text-dim); font-size:12px; }
  .modal-loading, .modal-empty{ color: var(--text-dim); font-size:13px; padding: 16px 0; font-family:'JetBrains Mono',monospace; }

  .f1-item{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .f1-pos{ font-family:'JetBrains Mono',monospace; color: var(--amber); font-weight:700; width: 28px; }
  .f1-name{ flex:1; font-size:14px; }
  .f1-detail{ font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--text-dim); }

  .empty, .loading, .error{
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 0;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
  }
  .error{ color: #f87171; }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size: 11px;
    padding: 20px;
    border-top: 1px solid var(--line);
  }
  #refreshBtn{
    background: var(--panel-hi);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor:pointer;
    margin-top: 8px;
  }
  #refreshBtn:hover{ color: var(--amber); border-color: var(--amber-dim); }
</style>
</head>
<body>

<div class="ticker-wrap">
  <div class="ticker-track mono" id="tickerTrack"><span>Loading scores…</span></div>
</div>

<header class="masthead">
  <h1>SCOREBOARD</h1>
  <div class="sub" id="clock">—</div>
</header>

<nav class="tabs">
  <button class="active" data-tab="nba">NBA</button>
  <button data-tab="nfl">NFL</button>
  <button data-tab="soccer">SOCCER</button>
  <button data-tab="college">COLLEGE</button>
  <button data-tab="f1">F1</button>
</nav>

<main id="content">
  <div class="loading">Loading…</div>
</main>

<footer>
  Scores via ESPN · F1 via Jolpica-Ergast · refreshes every 60s
  <br>
  <button id="refreshBtn">Refresh now</button>
</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div id="modalContent"><div class="modal-loading">Loading…</div></div>
  </div>
</div>

<script>
// ---- Config: your favorite teams (used to highlight + star) ----
const FAVORITES = ["San Antonio Spurs", "Houston Texans", "Paris Saint-Germain", "PSG"];

const ENDPOINTS = {
  nba: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard",
  nfl: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
  ligue1: "https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard",
  ucl: "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard",
  f1next: "https://api.jolpi.ca/ergast/f1/current/next.json",
  f1standings: "https://api.jolpi.ca/ergast/f1/current/driverStandings.json"
};

// ESPN team IDs (shared across a school's sports in most cases)
const COLLEGE_TEAMS = [
  { name: "Texas Longhorns", id: "251" },
  { name: "Oklahoma State Cowboys", id: "197" }
];
const COLLEGE_SPORTS = [
  { label: "Football", path: "football/college-football" },
  { label: "Men's Basketball", path: "basketball/mens-college-basketball" }
];

// event -> which ESPN sport/league path it came from, keyed by event id, so the
// detail modal knows which summary endpoint to call
const eventSourceMap = {};

function formatGameDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-US', {
    weekday:'short', month:'short', day:'numeric',
    hour:'numeric', minute:'2-digit'
  });
}

let currentTab = "nba";

function isFavorite(name){
  return FAVORITES.some(f => name && name.toLowerCase().includes(f.toLowerCase()));
}

function updateClock(){
  const el = document.getElementById('clock');
  const now = new Date();
  el.textContent = now.toLocaleString('en-US', {
    weekday:'short', month:'short', day:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
}

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

function renderEspnGames(events, container, sportPath){
  if(!events || events.length === 0){
    container.innerHTML += `<div class="empty">No games found</div>`;
    return;
  }
  events.forEach(ev => {
    const comp = ev.competitions[0];
    const competitors = comp.competitors;
    const home = competitors.find(c => c.homeAway === "home");
    const away = competitors.find(c => c.homeAway === "away");
    const state = comp.status.type.state; // "pre" | "in" | "post"
    const isLive = state === "in";
    const statusText = comp.status.type.shortDetail || comp.status.type.detail;

    const homeFav = isFavorite(home.team.displayName);
    const awayFav = isFavorite(away.team.displayName);
    const watch = homeFav || awayFav;

    const homeWin = state === "post" && parseInt(home.score) > parseInt(away.score);
    const awayWin = state === "post" && parseInt(away.score) > parseInt(home.score);

    const venue = comp.venue ? `${comp.venue.fullName || ''}${comp.venue.address && comp.venue.address.city ? ', ' + comp.venue.address.city : ''}` : '';

    const div = document.createElement('div');
    div.className = "game" + (watch ? " watch" : "");
    div.innerHTML = `
      <div class="teams">
        <div class="team-row">
          <span class="team-name ${awayFav ? 'fav' : ''} ${awayWin ? 'winner' : ''}">${away.team.displayName}</span>
          <span class="score ${awayWin ? 'winner' : ''}">${state === 'pre' ? '' : away.score}</span>
        </div>
        <div class="team-row">
          <span class="team-name ${homeFav ? 'fav' : ''} ${homeWin ? 'winner' : ''}">${home.team.displayName}</span>
          <span class="score ${homeWin ? 'winner' : ''}">${state === 'pre' ? '' : home.score}</span>
        </div>
        ${venue ? `<div class="game-date">${venue}</div>` : ''}
      </div>
      <div class="meta">
        <div class="status ${isLive ? 'live' : ''}">${statusText}</div>
        <div class="game-date">${formatGameDateTime(ev.date)}</div>
      </div>
    `;
    eventSourceMap[ev.id] = sportPath;
    div.addEventListener('click', () => openGameDetail(ev.id, sportPath));
    container.appendChild(div);
  });
}

// ---- Game detail modal ----
async function openGameDetail(eventId, sportPath){
  const backdrop = document.getElementById('modalBackdrop');
  const content = document.getElementById('modalContent');
  content.innerHTML = '<div class="modal-loading">Loading game detail…</div>';
  backdrop.classList.add('open');

  try{
    const url = `https://site.api.espn.com/apis/site/v2/sports/${sportPath}/summary?event=${eventId}`;
    const data = await fetchJSON(url);
    content.innerHTML = renderGameDetail(data);
  }catch(e){
    content.innerHTML = '<div class="modal-empty">Could not load game detail.</div>';
  }
}

function renderGameDetail(data){
  const header = data.header;
  const comp = header && header.competitions && header.competitions[0];
  const competitors = comp ? comp.competitors : [];
  const home = competitors.find(c => c.homeAway === "home");
  const away = competitors.find(c => c.homeAway === "away");
  const venue = comp && comp.venue ? `${comp.venue.fullName || ''}${comp.venue.address && comp.venue.address.city ? ', ' + comp.venue.address.city + (comp.venue.address.state ? ', ' + comp.venue.address.state : '') : ''}` : '';
  const dateStr = comp ? formatGameDateTime(comp.date) : '';
  const statusText = comp && comp.status ? comp.status.type.detail : '';

  let html = `
    <h2>${away ? away.team.displayName : 'Away'} @ ${home ? home.team.displayName : 'Home'}</h2>
    <div class="venue">${dateStr}${venue ? ' · ' + venue : ''}${statusText ? ' · ' + statusText : ''}</div>
  `;

  // Linescore by period
  if(home && away && home.linescores && away.linescores && home.linescores.length){
    const periods = home.linescores.length;
    let head = '<th></th>';
    for(let i=1;i<=periods;i++) head += `<th>${i}</th>`;
    head += '<th>T</th>';
    html += `<div class="modal-section-label">Score by period</div>
      <table class="linescore"><tr>${head}</tr>
      <tr><td>${away.team.abbreviation}</td>${away.linescores.map(l=>`<td>${l.displayValue ?? l.value}</td>`).join('')}<td><b>${away.score}</b></td></tr>
      <tr><td>${home.team.abbreviation}</td>${home.linescores.map(l=>`<td>${l.displayValue ?? l.value}</td>`).join('')}<td><b>${home.score}</b></td></tr>
      </table>`;
  }

  // Leaders (top performers)
  if(data.leaders && data.leaders.length){
    html += `<div class="modal-section-label">Top performers</div>`;
    data.leaders.forEach(teamLeader => {
      const cat = teamLeader.leaders && teamLeader.leaders[0];
      const top = cat && cat.leaders && cat.leaders[0];
      if(top){
        html += `<div class="leader-row">
          <span class="lname">${top.athlete.displayName} <span class="lstat">(${teamLeader.team ? teamLeader.team.abbreviation : ''})</span></span>
          <span class="lstat">${cat.displayName}: ${top.displayValue}</span>
        </div>`;
      }
    });
  }

  // Key / scoring plays
  const plays = data.plays || data.keyEvents;
  if(plays && plays.length){
    const scoring = plays.filter(p => p.scoringPlay).slice(-6);
    const toShow = scoring.length ? scoring : plays.slice(-6);
    html += `<div class="modal-section-label">Key plays</div>`;
    toShow.forEach(p => {
      html += `<div class="play-item">${p.text || p.shortText || ''}</div>`;
    });
  }

  if(!home && !away){
    html += `<div class="modal-empty">Limited detail available for this game.</div>`;
  }

  return html;
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modalBackdrop').classList.remove('open');
});
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if(e.target.id === 'modalBackdrop') e.target.classList.remove('open');
});

async function loadNBA(){
  const container = document.getElementById('content');
  container.innerHTML = '<div class="loading">Loading NBA…</div>';
  try{
    const data = await fetchJSON(ENDPOINTS.nba);
    container.innerHTML = '<div class="section-label">NBA · Next & recent games</div>';
    renderEspnGames(data.events, container, "basketball/nba");
  }catch(e){
    container.innerHTML = '<div class="error">Could not load NBA scores.</div>';
  }
}

async function loadNFL(){
  const container = document.getElementById('content');
  container.innerHTML = '<div class="loading">Loading NFL…</div>';
  try{
    const data = await fetchJSON(ENDPOINTS.nfl);
    container.innerHTML = '<div class="section-label">NFL · This Week</div>';
    renderEspnGames(data.events, container, "football/nfl");
  }catch(e){
    container.innerHTML = '<div class="error">Could not load NFL scores.</div>';
  }
}

async function loadSoccer(){
  const container = document.getElementById('content');
  container.innerHTML = '<div class="loading">Loading soccer…</div>';
  try{
    const [ligue1, ucl] = await Promise.all([
      fetchJSON(ENDPOINTS.ligue1).catch(() => ({events:[]})),
      fetchJSON(ENDPOINTS.ucl).catch(() => ({events:[]}))
    ]);
    container.innerHTML = '<div class="section-label">Ligue 1</div>';
    renderEspnGames(ligue1.events, container, "soccer/fra.1");
    container.innerHTML += '<div class="section-label">Champions League</div>';
    renderEspnGames(ucl.events, container, "soccer/uefa.champions");
  }catch(e){
    container.innerHTML = '<div class="error">Could not load soccer scores.</div>';
  }
}

async function loadCollege(){
  const container = document.getElementById('content');
  container.innerHTML = '<div class="loading">Loading college games…</div>';
  try{
    container.innerHTML = '';
    for(const sport of COLLEGE_SPORTS){
      container.innerHTML += `<div class="section-label">${sport.label}</div>`;
      const results = await Promise.all(
        COLLEGE_TEAMS.map(t =>
          fetchJSON(`https://site.api.espn.com/apis/site/v2/sports/${sport.path}/teams/${t.id}/schedule`)
            .then(d => ({ team: t, data: d }))
            .catch(() => ({ team: t, data: null }))
        )
      );
      results.forEach(r => {
        container.innerHTML += `<div class="team-group-label">${r.team.name}</div>`;
        if(!r.data || !r.data.events || r.data.events.length === 0){
          container.innerHTML += `<div class="empty">No schedule data</div>`;
          return;
        }
        // Show most relevant games: closest to now (recent + upcoming), max 5
        const now = Date.now();
        const events = [...r.data.events].sort((a,b) =>
          Math.abs(new Date(a.date) - now) - Math.abs(new Date(b.date) - now)
        ).slice(0, 5).sort((a,b) => new Date(a.date) - new Date(b.date));
        renderEspnGames(events, container, sport.path);
      });
    }
  }catch(e){
    container.innerHTML = '<div class="error">Could not load college schedules.</div>';
  }
}

async function loadF1(){
  const container = document.getElementById('content');
  container.innerHTML = '<div class="loading">Loading F1…</div>';
  try{
    const [nextRes, standingsRes] = await Promise.all([
      fetchJSON(ENDPOINTS.f1next).catch(() => null),
      fetchJSON(ENDPOINTS.f1standings).catch(() => null)
    ]);

    container.innerHTML = '<div class="section-label">Next Race</div>';
    const race = nextRes && nextRes.MRData.RaceTable.Races[0];
    if(race){
      const div = document.createElement('div');
      div.className = "f1-item";
      const raceDate = new Date(race.date + "T" + (race.time || "00:00:00Z"));
      div.innerHTML = `
        <div>
          <div class="team-name" style="font-weight:600;">${race.raceName}</div>
          <div class="f1-detail">${race.Circuit.circuitName}, ${race.Circuit.Location.locality}</div>
        </div>
        <div class="f1-detail">${raceDate.toLocaleDateString('en-US', {month:'short', day:'numeric'})}</div>
      `;
      container.appendChild(div);
    } else {
      container.innerHTML += '<div class="empty">No upcoming race data</div>';
    }

    container.innerHTML += '<div class="section-label">Driver Standings</div>';
    const standings = standingsRes && standingsRes.MRData.StandingsTable.StandingsLists[0];
    if(standings){
      standings.DriverStandings.slice(0, 10).forEach(d => {
        const div = document.createElement('div');
        div.className = "f1-item";
        div.innerHTML = `
          <span class="f1-pos">${d.position}</span>
          <span class="f1-name">${d.Driver.givenName} ${d.Driver.familyName} <span class="f1-detail">— ${d.Constructors[0].name}</span></span>
          <span class="f1-detail">${d.points} pts</span>
        `;
        container.appendChild(div);
      });
    } else {
      container.innerHTML += '<div class="empty">No standings data</div>';
    }
  }catch(e){
    container.innerHTML = '<div class="error">Could not load F1 data.</div>';
  }
}

async function loadTicker(){
  const track = document.getElementById('tickerTrack');
  try{
    const [nba, nfl, ligue1] = await Promise.all([
      fetchJSON(ENDPOINTS.nba).catch(() => ({events:[]})),
      fetchJSON(ENDPOINTS.nfl).catch(() => ({events:[]})),
      fetchJSON(ENDPOINTS.ligue1).catch(() => ({events:[]}))
    ]);
    const all = [...nba.events, ...nfl.events, ...ligue1.events];
    if(all.length === 0){
      track.innerHTML = '<span>No games today across NBA / NFL / Ligue 1</span>';
      return;
    }
    const items = all.map(ev => {
      const comp = ev.competitions[0];
      const home = comp.competitors.find(c => c.homeAway === "home");
      const away = comp.competitors.find(c => c.homeAway === "away");
      const state = comp.status.type.state;
      const scoreStr = state === 'pre'
        ? comp.status.type.shortDetail
        : `${away.score}-${home.score} (${comp.status.type.shortDetail})`;
      return `<span><b>${away.team.abbreviation}</b> @ <b>${home.team.abbreviation}</b> ${scoreStr}</span>`;
    });
    // duplicate list for seamless scroll loop
    track.innerHTML = items.join('') + items.join('');
  }catch(e){
    track.innerHTML = '<span>Ticker unavailable</span>';
  }
}

function loadTab(tab){
  currentTab = tab;
  if(tab === "nba") loadNBA();
  if(tab === "nfl") loadNFL();
  if(tab === "soccer") loadSoccer();
  if(tab === "college") loadCollege();
  if(tab === "f1") loadF1();
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadTab(btn.dataset.tab);
  });
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  loadTab(currentTab);
  loadTicker();
});

updateClock();
setInterval(updateClock, 1000 * 30);
loadTab('nba');
loadTicker();
setInterval(() => { loadTab(currentTab); loadTicker(); }, 60000);
</script>
</body>
