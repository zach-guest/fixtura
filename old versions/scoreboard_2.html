<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13;
    --panel:#131821;
    --panel-2:#1a212c;
    --line:#242c3a;
    --line-soft:#1d2431;
    --accent:#f0b429;
    --accent-dim:#8a6a1c;
    --text:#e9edf3;
    --dim:#7c8797;
    --dim-2:#5a6472;
    --live:#ef4444;
    --win:#4ade80;
    --loss:#ef7676;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  .cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* ---------- Ticker ---------- */
  .ticker{position:relative;height:32px;background:#080a0e;border-bottom:1px solid var(--line);overflow:hidden;display:flex;align-items:center}
  .ticker-tag{position:absolute;left:0;top:0;bottom:0;z-index:3;background:var(--live);color:#fff;display:flex;align-items:center;padding:0 10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px}
  .ticker-track{display:flex;gap:28px;padding-left:64px;white-space:nowrap;font-family:'Roboto Mono',monospace;font-size:11.5px;color:var(--dim);animation:roll 60s linear infinite}
  .ticker:hover .ticker-track{animation-play-state:paused}
  .ticker-track b{color:var(--text);font-weight:600}
  .ticker-track .sc{color:var(--accent)}
  @keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ---------- Header ---------- */
  header{display:flex;align-items:baseline;justify-content:space-between;padding:18px 22px 0;gap:16px;flex-wrap:wrap}
  header h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;letter-spacing:.06em}
  header h1 span{color:var(--accent)}
  #clock{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim-2)}

  nav.views{display:flex;gap:2px;padding:14px 22px 0;border-bottom:1px solid var(--line)}
  nav.views button{background:none;border:0;color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;letter-spacing:.08em;padding:8px 16px 12px;border-bottom:2px solid transparent}
  nav.views button.on{color:var(--accent);border-bottom-color:var(--accent)}
  nav.views button:hover:not(.on){color:var(--text)}

  main{max-width:900px;margin:0 auto;padding:18px 22px 70px}

  /* ---------- Controls ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#12151b}
  .chip:hover:not(.on){color:var(--text);border-color:var(--dim-2)}
  .datenav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .datenav button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 11px;font-size:13px}
  .datenav button:hover{border-color:var(--accent-dim);color:var(--accent)}
  .datenav input[type=date]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 9px;font-family:'Roboto Mono',monospace;font-size:12px;color-scheme:dark}

  .daylabel{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.05em;color:var(--text);margin:2px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .grouplabel{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1.6px;color:var(--accent-dim);text-transform:uppercase;margin:22px 0 9px}
  .grouplabel:first-child{margin-top:0}

  /* ---------- Game card ---------- */
  .game{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:7px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .12s,background .12s}
  .game:hover{border-color:var(--accent-dim);background:var(--panel-2)}
  .game.fav{border-left:3px solid var(--accent)}
  .rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .trow{display:flex;align-items:center;gap:9px}
  .logo{width:20px;height:20px;object-fit:contain;flex-shrink:0}
  .tname{font-size:13.5px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname.w{font-weight:700;color:#fff}
  .rec{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2);flex-shrink:0}
  .sc{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;min-width:30px;text-align:right;color:var(--dim)}
  .sc.w{color:var(--win)}
  .gmeta{text-align:right;flex-shrink:0;max-width:190px}
  .gstatus{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim);white-space:nowrap}
  .gstatus.live{color:var(--live);font-weight:700}
  .gstatus.live::before{content:"\25CF  "}
  .gsub{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--dim-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .msg{color:var(--dim);font-family:'Roboto Mono',monospace;font-size:12.5px;padding:26px 0;text-align:center}
  .msg.err{color:#f87171}

  /* ---------- Teams view ---------- */
  .teampick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .teambtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600}
  .teambtn.on{border-color:var(--accent);color:var(--accent)}
  .teambtn:hover:not(.on){border-color:var(--dim-2)}
  .browse{display:flex;gap:8px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
  .browse select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 10px;font-size:12.5px;font-family:inherit;max-width:230px}

  .teamhero{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:6px}
  .teamhero img{width:52px;height:52px;object-fit:contain}
  .teamhero h2{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;letter-spacing:.03em}
  .teamhero .sub{font-family:'Roboto Mono',monospace;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.6}
  .resbadge{font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
  .resbadge.W{background:rgba(74,222,128,.14);color:var(--win)}
  .resbadge.L{background:rgba(239,118,118,.14);color:var(--loss)}
  .resbadge.T{background:rgba(124,135,151,.16);color:var(--dim)}

  /* ---------- Modal ---------- */
  .backdrop{display:none;position:fixed;inset:0;background:rgba(4,6,9,.82);z-index:60;overflow-y:auto;padding:28px 14px}
  .backdrop.open{display:block}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;margin:0 auto;overflow:hidden}
  .mhead{padding:18px 20px 0;position:relative}
  .mclose{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--dim);font-size:26px;line-height:1}
  .mclose:hover{color:var(--text)}
  .mscore{display:flex;align-items:center;gap:16px;margin-bottom:12px}
  .mteam{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .mteam img{width:38px;height:38px;object-fit:contain}
  .mteam .n{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mteam .r{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2)}
  .mteam .p{font-family:'Roboto Mono',monospace;font-size:28px;font-weight:700}
  .mteam .p.w{color:var(--win)}
  .mmid{text-align:center;flex-shrink:0}
  .mmid .st{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--dim)}
  .mmid .st.live{color:var(--live);font-weight:700}
  .minfo{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim-2);line-height:1.7;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
  .mtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
  .mtabs button{background:none;border:0;color:var(--dim);font-size:12.5px;font-weight:600;padding:11px 13px;border-bottom:2px solid transparent;white-space:nowrap}
  .mtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .mtabs button:hover:not(.on){color:var(--text)}
  .mbody{padding:16px 20px 22px;max-height:66vh;overflow-y:auto}

  .sublabel{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1.4px;color:var(--accent-dim);text-transform:uppercase;margin:18px 0 8px}
  .sublabel:first-child{margin-top:0}
  .grptitle{font-size:11.5px;color:var(--dim);margin:12px 0 5px;font-weight:600}
  .tscroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px}
  table.st{width:100%;border-collapse:collapse;font-family:'Roboto Mono',monospace;font-size:11.5px;white-space:nowrap}
  table.st th{background:var(--panel-2);color:var(--dim);font-weight:500;padding:7px 9px;text-align:right}
  table.st td{padding:6px 9px;text-align:right;border-top:1px solid var(--line-soft)}
  table.st th:first-child,table.st td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);min-width:135px}
  table.st th:first-child{background:var(--panel-2)}
  table.st tr:hover td{background:var(--panel-2)}
  table.st .pos{color:var(--dim-2);font-size:10px}
  table.st tr.tot td{border-top:1px solid var(--line);color:var(--dim);font-weight:700}
  table.st.plain td:first-child,table.st.plain th:first-child{position:static;min-width:auto}

  .linescore th,.linescore td{text-align:center}
  .linescore td:first-child,.linescore th:first-child{text-align:left;min-width:60px}

  .teamstat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
  .teamstat .lbl{color:var(--dim);font-size:11.5px;text-align:center;flex:1}
  .teamstat .v{font-family:'Roboto Mono',monospace;font-weight:600;min-width:64px}
  .teamstat .v.a{text-align:left}
  .teamstat .v.h{text-align:right}

  .play{padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;display:flex;gap:11px}
  .play .clk{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2);min-width:62px;flex-shrink:0;padding-top:2px}
  .play .txt{color:var(--dim);line-height:1.5}
  .play.score .txt{color:var(--text)}
  .play .pts{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--accent);margin-left:6px}

  footer{border-top:1px solid var(--line);text-align:center;padding:16px;font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2)}
  footer button{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:5px 11px;font-family:'Roboto Mono',monospace;font-size:10.5px;margin-top:7px}
  footer button:hover{color:var(--accent);border-color:var(--accent-dim)}

  @media(max-width:640px){
    .gmeta{max-width:120px}
    .mteam .p{font-size:22px}
    .datenav{margin-left:0;width:100%}
  }
</style>
</head>
<body>

<div class="ticker">
  <div class="ticker-tag">LIVE</div>
  <div class="ticker-track" id="tick"><span>Loading...</span></div>
</div>

<header>
  <h1 class="cond">SCORE<span>BOARD</span></h1>
  <div id="clock">&mdash;</div>
</header>

<nav class="views">
  <button class="on" data-view="scores">SCORES</button>
  <button data-view="teams">TEAMS</button>
  <button data-view="f1">F1</button>
</nav>

<main id="main"><div class="msg">Loading...</div></main>

<footer>
  Data via ESPN &middot; F1 via Jolpica-Ergast
  <br><button id="refresh">Refresh</button>
</footer>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <div id="modalInner"><div class="msg">Loading...</div></div>
  </div>
</div>

<script>
/* ============================== CONFIG ============================== */

const LEAGUES = {
  nba:    {label:'NBA',     path:'basketball/nba',                     kind:'basketball'},
  nfl:    {label:'NFL',     path:'football/nfl',                       kind:'football'},
  ncaaf:  {label:'CFB',     path:'football/college-football',          kind:'football',   extra:'&groups=80&limit=200'},
  ncaam:  {label:'CBB',     path:'basketball/mens-college-basketball', kind:'basketball', extra:'&groups=50&limit=200'},
  fra1:   {label:'Ligue 1', path:'soccer/fra.1',                       kind:'soccer'},
  ucl:    {label:'UCL',     path:'soccer/uefa.champions',              kind:'soccer'}
};

const MY_TEAMS = [
  {name:'San Antonio Spurs',   short:'Spurs',       league:'nba',   id:'24'},
  {name:'Houston Texans',      short:'Texans',      league:'nfl',   id:'34'},
  {name:'Texas Longhorns',     short:'Texas FB',    league:'ncaaf', id:'251'},
  {name:'Oklahoma State',      short:'Ok State FB', league:'ncaaf', id:'197'},
  {name:'Texas Longhorns',     short:'Texas BB',    league:'ncaam', id:'251'},
  {name:'Oklahoma State',      short:'Ok State BB', league:'ncaam', id:'197'},
  {name:'Paris Saint-Germain', short:'PSG',         league:'fra1',  id:'160'}
];
const FAV_NAMES = ['San Antonio Spurs','Houston Texans','Texas Longhorns','Oklahoma State','Paris Saint-Germain'];

const API = 'https://site.api.espn.com/apis/site/v2/sports';
const F1_NEXT = 'https://api.jolpi.ca/ergast/f1/current/next.json';
const F1_DRV  = 'https://api.jolpi.ca/ergast/f1/current/driverStandings.json';
const F1_CON  = 'https://api.jolpi.ca/ergast/f1/current/constructorStandings.json';
const F1_LAST = 'https://api.jolpi.ca/ergast/f1/current/last/results.json';

/* ============================== STATE ============================== */

let view = 'scores';
let league = 'nba';
let dateObj = new Date();
let activeTeam = null;
let modalData = null;
let modalTab = 'box';

/* ============================== UTIL ============================== */

const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function get(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

function ymd(d){
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
function inputDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayLabel(d){
  const t = new Date(); t.setHours(0,0,0,0);
  const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((x-t)/86400000);
  const base = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  if(diff === 0) return 'TODAY \u2014 ' + base;
  if(diff === 1) return 'TOMORROW \u2014 ' + base;
  if(diff === -1) return 'YESTERDAY \u2014 ' + base;
  return base.toUpperCase();
}
function gameTime(iso){
  return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function gameTimeOnly(iso){
  return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function isFav(n){ return FAV_NAMES.some(f => n && n.toLowerCase().indexOf(f.toLowerCase()) !== -1); }
function titleCase(s){ return String(s||'').replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim(); }
function num(v){ return v === null || v === undefined ? '' : v; }

function clock(){
  $('#clock').textContent = new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

/* ============================== GAME CARD ============================== */

function gameCard(ev, leagueKey){
  const comp = ev.competitions && ev.competitions[0];
  if(!comp) return '';
  const cs = comp.competitors || [];
  const home = cs.find(c=>c.homeAway==='home') || cs[0];
  const away = cs.find(c=>c.homeAway==='away') || cs[1];
  if(!home || !away) return '';

  const state = comp.status && comp.status.type && comp.status.type.state;
  const live = state === 'in';
  const done = state === 'post';
  const status = (comp.status && comp.status.type && comp.status.type.shortDetail) || '';

  const hW = done && home.winner, aW = done && away.winner;
  const fav = isFav(home.team && home.team.displayName) || isFav(away.team && away.team.displayName);

  const bcast = (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names && comp.broadcasts[0].names.join('/')) || '';
  const venue = (comp.venue && comp.venue.fullName) || '';
  const sub = state === 'pre' ? [venue, bcast].filter(Boolean).join(' \u00b7 ') : venue;

  const row = (t, won) => '<div class="trow">' +
    (t.team && t.team.logo ? '<img class="logo" src="'+esc(t.team.logo)+'" alt="">' : '<div class="logo"></div>') +
    '<span class="tname '+(won?'w':'')+'">'+esc((t.team && (t.team.displayName || t.team.name)) || '')+'</span>' +
    (t.records && t.records[0] && t.records[0].summary ? '<span class="rec">'+esc(t.records[0].summary)+'</span>' : '') +
    '<span class="sc '+(won?'w':'')+'">'+(state==='pre' ? '' : esc(num(t.score)))+'</span></div>';

  return '<div class="game '+(fav?'fav':'')+'" data-ev="'+esc(ev.id)+'" data-lg="'+esc(leagueKey)+'">' +
    '<div class="rows">'+row(away,aW)+row(home,hW)+'</div>' +
    '<div class="gmeta">' +
      '<div class="gstatus '+(live?'live':'')+'">'+esc(state==='pre' ? gameTimeOnly(ev.date) : status)+'</div>' +
      '<div class="gsub">'+esc(sub)+'</div>' +
    '</div></div>';
}

function wireCards(){
  document.querySelectorAll('.game').forEach(el=>{
    el.onclick = () => openGame(el.dataset.ev, el.dataset.lg);
  });
}

/* ============================== SCORES VIEW ============================== */

function renderScoresShell(){
  const chips = Object.keys(LEAGUES).map(k =>
    '<button class="chip '+(k===league?'on':'')+'" data-lg="'+k+'">'+LEAGUES[k].label+'</button>').join('');
  $('#main').innerHTML =
    '<div class="controls">' +
      '<div class="chips">'+chips+'</div>' +
      '<div class="datenav">' +
        '<button id="prev">&lsaquo;</button>' +
        '<input type="date" id="dpick" value="'+inputDate(dateObj)+'">' +
        '<button id="today">Today</button>' +
        '<button id="next">&rsaquo;</button>' +
      '</div>' +
    '</div>' +
    '<div class="daylabel cond">'+dayLabel(dateObj)+'</div>' +
    '<div id="games"><div class="msg">Loading...</div></div>';

  document.querySelectorAll('.chip').forEach(c=>{
    c.onclick = () => { league = c.dataset.lg; renderScoresShell(); loadScores(); };
  });
  $('#prev').onclick = () => { dateObj.setDate(dateObj.getDate()-1); renderScoresShell(); loadScores(); };
  $('#next').onclick = () => { dateObj.setDate(dateObj.getDate()+1); renderScoresShell(); loadScores(); };
  $('#today').onclick = () => { dateObj = new Date(); renderScoresShell(); loadScores(); };
  $('#dpick').onchange = e => {
    const p = e.target.value.split('-');
    dateObj = new Date(+p[0], +p[1]-1, +p[2]);
    renderScoresShell(); loadScores();
  };
}

async function loadScores(){
  const box = $('#games');
  const L = LEAGUES[league];
  try{
    const data = await get(API+'/'+L.path+'/scoreboard?dates='+ymd(dateObj)+(L.extra||''));
    const evs = data.events || [];
    if(!evs.length){ box.innerHTML = '<div class="msg">No '+L.label+' games on this date</div>'; return; }

    evs.sort((a,b)=>{
      const f = ev => ((ev.competitions&&ev.competitions[0]&&ev.competitions[0].competitors)||[])
        .some(c=>isFav(c.team && c.team.displayName)) ? 0 : 1;
      const s = ev => (ev.competitions&&ev.competitions[0]&&ev.competitions[0].status&&ev.competitions[0].status.type.state)==='in' ? 0 : 1;
      return f(a)-f(b) || s(a)-s(b) || new Date(a.date)-new Date(b.date);
    });
    box.innerHTML = evs.map(e=>gameCard(e, league)).join('');
    wireCards();
  }catch(e){
    box.innerHTML = '<div class="msg err">Couldn\'t load '+L.label+' for this date.</div>';
  }
}

/* ============================== TEAMS VIEW ============================== */

function renderTeamsShell(){
  const btns = MY_TEAMS.map((t,i)=>
    '<button class="teambtn '+(activeTeam && activeTeam.id===t.id && activeTeam.league===t.league ?'on':'')+'" data-i="'+i+'">'+esc(t.short)+'</button>').join('');
  const leagueOpts = Object.keys(LEAGUES).map(k=>'<option value="'+k+'">'+LEAGUES[k].label+'</option>').join('');
  $('#main').innerHTML =
    '<div class="grouplabel">My teams</div>' +
    '<div class="teampick">'+btns+'</div>' +
    '<div class="browse">' +
      '<span class="grouplabel" style="margin:0">Browse any team</span>' +
      '<select id="brLeague">'+leagueOpts+'</select>' +
      '<select id="brTeam"><option>Loading...</option></select>' +
    '</div>' +
    '<div id="teamBody"></div>';

  document.querySelectorAll('.teambtn').forEach(b=>{
    b.onclick = () => { activeTeam = MY_TEAMS[+b.dataset.i]; renderTeamsShell(); };
  });
  $('#brLeague').value = (activeTeam && activeTeam.league) || league;
  $('#brLeague').onchange = loadTeamList;
  loadTeamList();
  if(activeTeam) loadTeam();
  else $('#teamBody').innerHTML = '<div class="msg">Pick a team to see full schedule, results, and records.</div>';
}

async function loadTeamList(){
  const lg = $('#brLeague').value;
  const sel = $('#brTeam');
  sel.innerHTML = '<option>Loading...</option>';
  try{
    const data = await get(API+'/'+LEAGUES[lg].path+'/teams?limit=500');
    const teams = (((data.sports||[])[0]||{}).leagues||[])[0];
    const list = ((teams && teams.teams) || []).map(t=>t.team)
      .sort((a,b)=>a.displayName.localeCompare(b.displayName));
    sel.innerHTML = '<option value="">Select a team...</option>' +
      list.map(t=>'<option value="'+t.id+'">'+esc(t.displayName)+'</option>').join('');
    sel.onchange = () => {
      if(!sel.value) return;
      const t = list.find(x=>x.id===sel.value);
      activeTeam = {name:t.displayName, short:t.displayName, league:lg, id:t.id};
      document.querySelectorAll('.teambtn').forEach(b=>b.classList.remove('on'));
      loadTeam();
    };
  }catch(e){ sel.innerHTML = '<option>Unavailable</option>'; }
}

async function loadTeam(){
  const body = $('#teamBody');
  body.innerHTML = '<div class="msg">Loading schedule...</div>';
  const t = activeTeam;
  try{
    const results = await Promise.all([
      get(API+'/'+LEAGUES[t.league].path+'/teams/'+t.id).catch(()=>null),
      get(API+'/'+LEAGUES[t.league].path+'/teams/'+t.id+'/schedule')
    ]);
    const info = results[0], sched = results[1];
    const ti = info && info.team;
    const rec = (ti && ti.record && ti.record.items && ti.record.items[0] && ti.record.items[0].summary) || '';
    const standing = (ti && ti.standingSummary) || '';
    const logo = ti && ti.logos && ti.logos[0] && ti.logos[0].href;

    let html = '<div class="teamhero">' +
      (logo ? '<img src="'+esc(logo)+'" alt="">' : '') +
      '<div><h2 class="cond">'+esc((ti && ti.displayName) || t.name)+'</h2>' +
      '<div class="sub">'+esc([rec, standing, LEAGUES[t.league].label].filter(Boolean).join(' \u00b7 '))+'</div></div></div>';

    const evs = (sched.events || []).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
    const now = Date.now();
    const past = evs.filter(e => new Date(e.date) < now);
    const future = evs.filter(e => new Date(e.date) >= now);

    if(future.length) html += '<div class="grouplabel">Upcoming (' + future.length + ')</div>' + future.map(e=>teamRow(e,t)).join('');
    if(past.length)   html += '<div class="grouplabel">Results (' + past.length + ')</div>' + past.slice().reverse().map(e=>teamRow(e,t)).join('');
    if(!evs.length)   html += '<div class="msg">No schedule available for this season yet.</div>';

    body.innerHTML = html;
    wireCards();
  }catch(e){
    body.innerHTML = '<div class="msg err">Couldn\'t load this team\'s schedule.</div>';
  }
}

function teamRow(ev, t){
  const comp = ev.competitions && ev.competitions[0];
  if(!comp) return '';
  const cs = comp.competitors || [];
  const me = cs.find(c=>c.team && c.team.id === t.id) || cs[0];
  const opp = cs.find(c=>c.team && c.team.id !== t.id) || cs[1];
  if(!me || !opp) return '';

  const st = comp.status && comp.status.type && comp.status.type.state;
  const done = st === 'post', live = st === 'in';
  const home = me.homeAway === 'home';

  let badge = '';
  if(done){
    const w = me.winner === true ? 'W' : (opp.winner === true ? 'L' : 'T');
    badge = '<span class="resbadge '+w+'">'+w+'</span>';
  }
  const sVal = x => (x && x.score && (x.score.displayValue !== undefined ? x.score.displayValue : x.score)) || '';
  const scoreTxt = (done || live) ? esc(sVal(me))+'\u2013'+esc(sVal(opp)) : '';

  const venue = (comp.venue && comp.venue.fullName) || '';
  const bcast = (comp.broadcasts && comp.broadcasts[0] && (comp.broadcasts[0].media && comp.broadcasts[0].media.shortName)) || '';
  const oppLogo = opp.team && opp.team.logos && opp.team.logos[0] && opp.team.logos[0].href;
  const note = (ev.notes && ev.notes[0] && ev.notes[0].headline) || '';

  return '<div class="game" data-ev="'+esc(ev.id)+'" data-lg="'+esc(t.league)+'">' +
    '<div class="rows"><div class="trow">' +
      (oppLogo ? '<img class="logo" src="'+esc(oppLogo)+'" alt="">' : '<div class="logo"></div>') +
      '<span class="tname">'+(home?'vs':'@')+' '+esc((opp.team && opp.team.displayName)||'')+'</span>' +
      badge +
      '<span class="sc '+(done && me.winner ? 'w':'')+'">'+scoreTxt+'</span>' +
    '</div>' +
    (venue || note ? '<div class="trow"><span class="gsub">'+esc([venue,note].filter(Boolean).join(' \u00b7 '))+'</span></div>' : '') +
    '</div>' +
    '<div class="gmeta">' +
      '<div class="gstatus '+(live?'live':'')+'">'+esc(live ? comp.status.type.shortDetail : gameTime(ev.date))+'</div>' +
      '<div class="gsub">'+esc(bcast)+'</div>' +
    '</div></div>';
}

/* ============================== GAME DETAIL ============================== */

async function openGame(eventId, leagueKey){
  $('#backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#modalInner').innerHTML = '<div class="msg">Loading game...</div>';
  modalTab = 'box';
  try{
    const data = await get(API+'/'+LEAGUES[leagueKey].path+'/summary?event='+eventId);
    modalData = {data:data, kind:LEAGUES[leagueKey].kind};
    drawModal();
  }catch(e){
    $('#modalInner').innerHTML = '<div class="msg err">Couldn\'t load this game.</div>';
  }
}

function closeModal(){
  $('#backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

function drawModal(){
  const data = modalData.data;
  const h = data.header;
  const comp = h && h.competitions && h.competitions[0];
  const cs = (comp && comp.competitors) || [];

  const away = cs.find(c=>c.homeAway==='away') || cs[1];
  const stype = comp && comp.status && comp.status.type;
  const live = stype && stype.state === 'in';
  const pre = stype && stype.state === 'pre';

  const teamBlock = (t, right) => {
    if(!t) return '';
    const logo = t.team && t.team.logos && t.team.logos[0] && t.team.logos[0].href;
    const rec = (t.record && t.record[0] && t.record[0].displayValue) ||
                (t.records && t.records[0] && t.records[0].summary) || '';
    return '<div class="mteam" style="'+(right?'flex-direction:row-reverse;text-align:right':'')+'">' +
      (logo ? '<img src="'+esc(logo)+'" alt="">' : '') +
      '<div style="min-width:0"><div class="n">'+esc((t.team && t.team.displayName)||'')+'</div>' +
      '<div class="r">'+esc(rec)+'</div></div>' +
      (pre ? '' : '<div class="p '+(t.winner?'w':'')+'">'+esc(num(t.score))+'</div>') +
      '</div>';
  };

  const gi = data.gameInfo || {};
  const venue = (gi.venue && gi.venue.fullName) || (comp && comp.venue && comp.venue.fullName) || '';
  const addr = gi.venue && gi.venue.address;
  const city = addr ? [addr.city, addr.state].filter(Boolean).join(', ') : '';
  const bcast = (comp && comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].media && comp.broadcasts[0].media.shortName) || '';
  const att = gi.attendance ? Number(gi.attendance).toLocaleString() : '';
  const odds = (data.pickcenter && data.pickcenter[0] && data.pickcenter[0].details) || '';
  const wx = data.weather ? ((data.weather.temperature !== undefined ? data.weather.temperature+'\u00b0' : '') + (data.weather.displayValue ? ' '+data.weather.displayValue : '')) : '';
  const line3 = [bcast && 'TV: '+bcast, att && 'Att: '+att, odds && 'Line: '+odds, wx].filter(Boolean).join('   \u00b7   ');

  const tabs = [['box','Box Score'],['team','Team Stats'],['plays','Plays'],['info','Game Info']];

  $('#modalInner').innerHTML =
    '<div class="mhead">' +
      '<button class="mclose" onclick="closeModal()">&times;</button>' +
      '<div class="mscore">'+teamBlock(away,false) +
        '<div class="mmid"><div class="st '+(live?'live':'')+'">'+esc((stype && stype.shortDetail)||'')+'</div></div>' +
        teamBlock(home,true)+'</div>' +
      '<div class="minfo">' +
        esc(comp ? new Date(comp.date).toLocaleString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) : '') +
        (venue ? '<br>'+esc(venue)+(city ? ' \u00b7 '+esc(city) : '') : '') +
        (line3 ? '<br>'+esc(line3) : '') +
      '</div></div>' +
    '<div class="mtabs">'+tabs.map(t=>'<button class="'+(t[0]===modalTab?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>' +
    '<div class="mbody" id="mbody"></div>';

  document.querySelectorAll('.mtabs button').forEach(b=>{
    b.onclick = () => { modalTab = b.dataset.t; drawModal(); };
  });
  drawModalBody();
}

function drawModalBody(){
  const d = modalData.data, k = modalData.kind, el = $('#mbody');
  if(modalTab === 'box') el.innerHTML = renderBox(d, k);
  else if(modalTab === 'team') el.innerHTML = renderTeamStats(d);
  else if(modalTab === 'plays') el.innerHTML = renderPlays(d);
  else el.innerHTML = renderInfo(d);
}

/* ---- Box score ---- */
function renderBox(data, kind){
  let html = '';

  const comp = data.header && data.header.competitions && data.header.competitions[0];
  const cs = (comp && comp.competitors) || [];
  const home = cs.find(c=>c.homeAway==='home'), away = cs.find(c=>c.homeAway==='away');
  if(home && away && home.linescores && away.linescores && home.linescores.length){
    const n = Math.max(home.linescores.length, away.linescores.length);
    const heads = [];
    for(let i=1;i<=n;i++){
      if(kind==='soccer') heads.push(i===1?'1H':(i===2?'2H':'ET'));
      else if(kind==='basketball') heads.push(i<=4?('Q'+i):('OT'+(i-4)));
      else heads.push(i<=4?String(i):('OT'+(i-4)));
    }
    const rowFor = t => {
      let cells = '';
      for(let i=0;i<n;i++){
        const ls = t.linescores[i];
        cells += '<td>'+esc(ls ? (ls.displayValue !== undefined ? ls.displayValue : ls.value) : '-')+'</td>';
      }
      return '<tr><td>'+esc((t.team && t.team.abbreviation)||'')+'</td>'+cells+'<td><b>'+esc(num(t.score))+'</b></td></tr>';
    };
    html += '<div class="sublabel">Score by period</div><div class="tscroll"><table class="st linescore">' +
      '<thead><tr><th></th>'+heads.map(x=>'<th>'+x+'</th>').join('')+'<th>T</th></tr></thead>' +
      '<tbody>'+rowFor(away)+rowFor(home)+'</tbody></table></div>';
  }

  const players = (data.boxscore && data.boxscore.players) || [];
  if(!players.length){
    html += '<div class="msg">Player stats aren\'t posted for this game yet.</div>';
    return html;
  }

  players.forEach(tb => {
    const tName = (tb.team && (tb.team.displayName || tb.team.name)) || '';
    html += '<div class="sublabel">'+esc(tName)+'</div>';
    let any = false;
    (tb.statistics || []).forEach(group => {
      const labels = group.labels || group.keys || [];
      const aths = group.athletes || [];
      if(!aths.length) return;
      any = true;
      const title = group.text || titleCase(group.name || '');
      const descs = group.descriptions || [];
      html += '<div class="grptitle">'+esc(title)+'</div><div class="tscroll"><table class="st"><thead><tr><th>Player</th>' +
        labels.map((l,i)=>'<th title="'+esc(descs[i]||l)+'">'+esc(l)+'</th>').join('') + '</tr></thead><tbody>';
      aths.forEach(a => {
        const ath = a.athlete || {};
        const nm = ath.displayName || ath.shortName || '';
        const pos = (ath.position && ath.position.abbreviation) || '';
        html += '<tr><td>'+esc(nm)+(pos?' <span class="pos">'+esc(pos)+'</span>':'')+'</td>' +
          (a.stats||[]).map(s=>'<td>'+esc(s)+'</td>').join('') + '</tr>';
      });
      if(group.totals && group.totals.length){
        html += '<tr class="tot"><td>Total</td>'+group.totals.map(s=>'<td>'+esc(s)+'</td>').join('')+'</tr>';
      }
      html += '</tbody></table></div>';
    });
    if(!any) html += '<div class="msg">No player stats for this team.</div>';
  });

  return html;
}

/* ---- Team stats ---- */
function renderTeamStats(data){
  const teams = (data.boxscore && data.boxscore.teams) || [];
  if(teams.length < 2) return '<div class="msg">Team stats not available for this game.</div>';
  const a = teams[0].statistics || [], b = teams[1].statistics || [];
  if(!a.length) return '<div class="msg">Team stats not available for this game.</div>';

  let html = '<div class="teamstat" style="border-bottom:1px solid var(--line)">' +
    '<span class="v a" style="color:var(--accent)">'+esc((teams[0].team&&teams[0].team.abbreviation)||'')+'</span>' +
    '<span class="lbl"></span>' +
    '<span class="v h" style="color:var(--accent)">'+esc((teams[1].team&&teams[1].team.abbreviation)||'')+'</span></div>';

  a.forEach((s,i)=>{
    const m = b.find(x=>x.name === s.name) || b[i];
    html += '<div class="teamstat">' +
      '<span class="v a">'+esc(s.displayValue)+'</span>' +
      '<span class="lbl">'+esc(s.label || titleCase(s.name))+'</span>' +
      '<span class="v h">'+esc(m ? m.displayValue : '')+'</span></div>';
  });
  return html;
}

/* ---- Plays ---- */
function renderPlays(data){
  const scoring = data.scoringPlays || [];
  const key = data.keyEvents || [];
  const all = data.plays || [];
  let html = '';

  if(scoring.length){
    html += '<div class="sublabel">Scoring plays</div>' + scoring.slice().reverse().map(p=>{
      const per = (p.period && (p.period.displayValue || ('Q'+p.period.number))) || '';
      const clk = [per, p.clock && p.clock.displayValue].filter(Boolean).join(' ');
      const sc = (p.awayScore !== undefined && p.homeScore !== undefined) ? (p.awayScore+'\u2013'+p.homeScore) : '';
      return '<div class="play score"><span class="clk">'+esc(clk)+'</span><span class="txt">'+esc(p.text||'') +
        (sc ? '<span class="pts">'+esc(sc)+'</span>' : '')+'</span></div>';
    }).join('');
  }

  if(key.length){
    html += '<div class="sublabel">Key events</div>' + key.slice().reverse().slice(0,30).map(p=>{
      const clk = (p.clock && p.clock.displayValue) || '';
      const who = (p.athletesInvolved || []).map(x=>x.displayName).join(', ');
      return '<div class="play"><span class="clk">'+esc(clk)+'</span><span class="txt">' +
        esc(p.text || (p.type && p.type.text) || '') + (who ? ' \u2014 '+esc(who) : '')+'</span></div>';
    }).join('');
  }

  if(!scoring.length && !key.length && all.length){
    html += '<div class="sublabel">Recent plays</div>' + all.slice(-45).reverse().map(p=>{
      const per = p.period && p.period.number ? 'Q'+p.period.number : '';
      const clk = [per, p.clock && p.clock.displayValue].filter(Boolean).join(' ');
      return '<div class="play '+(p.scoringPlay?'score':'')+'"><span class="clk">'+esc(clk)+'</span><span class="txt">'+esc(p.text||'')+'</span></div>';
    }).join('');
  }

  return html || '<div class="msg">No play data for this game.</div>';
}

/* ---- Info ---- */
function renderInfo(data){
  let html = '';

  if(data.leaders && data.leaders.length){
    html += '<div class="sublabel">Game leaders</div>';
    data.leaders.forEach(t=>{
      (t.leaders||[]).forEach(cat=>{
        const top = cat.leaders && cat.leaders[0];
        if(!top) return;
        html += '<div class="teamstat"><span style="flex:1;text-align:left;font-size:12.5px">' +
          esc((top.athlete && top.athlete.displayName) || '') +
          ' <span style="color:var(--dim-2);font-family:\'Roboto Mono\',monospace;font-size:10.5px">'+esc((t.team&&t.team.abbreviation)||'')+'</span></span>' +
          '<span style="font-family:\'Roboto Mono\',monospace;color:var(--dim);font-size:11.5px">'+esc(cat.displayName)+': '+esc(top.displayValue)+'</span></div>';
      });
    });
  }

  const gi = data.gameInfo || {};
  if(gi.officials && gi.officials.length){
    html += '<div class="sublabel">Officials</div><div style="font-size:12.5px;color:var(--dim);line-height:1.8">' +
      gi.officials.map(o=>esc(o.displayName)+((o.position&&o.position.displayName)?' <span style="color:var(--dim-2)">('+esc(o.position.displayName)+')</span>':'')).join('<br>') + '</div>';
  }

  if(data.injuries && data.injuries.some(t=>t.injuries && t.injuries.length)){
    html += '<div class="sublabel">Injuries</div>';
    data.injuries.forEach(t=>{
      if(!t.injuries || !t.injuries.length) return;
      html += '<div class="grptitle">'+esc((t.team&&t.team.abbreviation)||'')+'</div>';
      html += t.injuries.map(i=>'<div class="play"><span class="txt">'+esc((i.athlete&&i.athlete.displayName)||'') +
        ' <span style="color:var(--dim-2)">\u2014 '+esc(i.status||'')+((i.details&&i.details.type)?' ('+esc(i.details.type)+')':'')+'</span></span></div>').join('');
    });
  }

  if(data.standings && data.standings.groups && data.standings.groups.length){
    html += '<div class="sublabel">Standings</div>';
    data.standings.groups.forEach(g=>{
      const entries = (g.standings && g.standings.entries) || [];
      if(!entries.length) return;
      html += '<div class="grptitle">'+esc(g.header||'')+'</div>';
      html += '<div class="tscroll"><table class="st plain"><thead><tr><th style="text-align:left">Team</th><th>W</th><th>L</th><th>PCT</th></tr></thead><tbody>';
      entries.forEach(en=>{
        const f = n => { const s = (en.stats||[]).find(x=>x.name===n); return s ? s.displayValue : ''; };
        html += '<tr><td style="text-align:left">'+esc((en.team&&en.team.displayName)||'')+'</td><td>'+esc(f('wins'))+'</td><td>'+esc(f('losses'))+'</td><td>'+esc(f('winPercent'))+'</td></tr>';
      });
      html += '</tbody></table></div>';
    });
  }

  if(data.article && data.article.headline){
    html += '<div class="sublabel">Recap</div><div style="font-size:13px;line-height:1.6;color:var(--dim)">' +
      '<b style="color:var(--text)">'+esc(data.article.headline)+'</b><br>'+esc(data.article.description||'')+'</div>';
  }

  return html || '<div class="msg">No extra info for this game.</div>';
}

    if(ds){
      html += '<div class="grouplabel">Driver standings</div><div class="tscroll"><table class="st plain">' +
        '<thead><tr><th style="text-align:left">Pos</th><th style="text-align:left">Driver</th><th style="text-align:left">Team</th><th>Wins</th><th>Pts</th></tr></thead><tbody>' +
        ds.DriverStandings.map(d=>'<tr><td style="text-align:left">'+esc(d.position)+'</td>' +
          '<td style="text-align:left">'+esc(d.Driver.givenName+' '+d.Driver.familyName)+'</td>' +
          '<td style="text-align:left">'+esc((d.Constructors[0]||{}).name||'')+'</td>' +
          '<td>'+esc(d.wins)+'</td><td><b>'+esc(d.points)+'</b></td></tr>').join('') + '</tbody></table></div>';
    }

    const cst = con && con.MRData && con.MRData.StandingsTable.StandingsLists[0];
    if(cst){
      html += '<div class="grouplabel">Constructor standings</div><div class="tscroll"><table class="st plain">' +
        '<thead><tr><th style="text-align:left">Pos</th><th style="text-align:left">Team</th><th>Wins</th><th>Pts</th></tr></thead><tbody>' +
        cst.ConstructorStandings.map(c=>'<tr><td style="text-align:left">'+esc(c.position)+'</td>' +
          '<td style="text-align:left">'+esc(c.Constructor.name)+'</td><td>'+esc(c.wins)+'</td><td><b>'+esc(c.points)+'</b></td></tr>').join('') +
        '</tbody></table></div>';
    }

    m.innerHTML = html || '<div class="msg">No F1 data available right now.</div>';
  }catch(e){
    m.innerHTML = '<div class="msg err">Couldn\'t load F1 data.</div>';
  }
}

/* ============================== TICKER ============================== */

async function loadTicker(){
  const el = $('#tick');
  try{
    const keys = ['nba','nfl','ncaaf','fra1'];
    const today = ymd(new Date());
    const res = await Promise.all(keys.map(k =>
      get(API+'/'+LEAGUES[k].path+'/scoreboard?dates='+today+(LEAGUES[k].extra||'')).catch(()=>({events:[]}))
    ));
    const items = [];
    res.forEach(d=>{
      (d.events||[]).slice(0,12).forEach(ev=>{
        const c = ev.competitions && ev.competitions[0]; if(!c) return;
        const cs = c.competitors||[];
        const h = cs.find(x=>x.homeAway==='home'), a = cs.find(x=>x.homeAway==='away');
        if(!h||!a) return;
        const st = c.status && c.status.type && c.status.type.state;
        const val = st==='pre' ? gameTimeOnly(ev.date)
          : '<span class="sc">'+esc(num(a.score))+'-'+esc(num(h.score))+'</span> '+esc(c.status.type.shortDetail);
        items.push('<span><b>'+esc((a.team&&a.team.abbreviation)||'')+'</b>@<b>'+esc((h.team&&h.team.abbreviation)||'')+'</b> '+val+'</span>');
      });
    });
    el.innerHTML = items.length ? items.join('')+items.join('') : '<span>No games today</span>';
  }catch(e){ el.innerHTML = '<span>Ticker unavailable</span>'; }
}

/* ============================== ROUTER ============================== */

function render(){
  if(view === 'scores'){ renderScoresShell(); loadScores(); }
  else if(view === 'teams'){ renderTeamsShell(); }
  else loadF1();
}

document.querySelectorAll('nav.views button').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('nav.views button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    view = b.dataset.view;
    render();
  };
});

$('#refresh').onclick = () => { render(); loadTicker(); };
$('#backdrop').onclick = e => { if(e.target.id === 'backdrop') closeModal(); };
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  if(view !== 'scores' || $('#backdrop').classList.contains('open')) return;
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft'){ dateObj.setDate(dateObj.getDate()-1); renderScoresShell(); loadScores(); }
  if(e.key === 'ArrowRight'){ dateObj.setDate(dateObj.getDate()+1); renderScoresShell(); loadScores(); }
});

clock();
setInterval(clock, 30000);
render();
loadTicker();
setInterval(()=>{
  if(!$('#backdrop').classList.contains('open')){ render(); loadTicker(); }
}, 60000);
</script>
