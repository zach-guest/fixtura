<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13; --panel:#131821; --panel-2:#1a212c;
    --line:#242c3a; --line-soft:#1d2431;
    --accent:#f0b429; --accent-dim:#8a6a1c;
    --text:#e9edf3; --dim:#7c8797; --dim-2:#5a6472;
    --live:#ef4444; --win:#4ade80; --loss:#ef7676;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  .cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  .ticker{position:relative;height:32px;background:#080a0e;border-bottom:1px solid var(--line);overflow:hidden;display:flex;align-items:center}
  .ticker-tag{position:absolute;left:0;top:0;bottom:0;z-index:3;background:var(--live);color:#fff;display:flex;align-items:center;padding:0 10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px}
  .ticker-track{display:flex;gap:28px;padding-left:64px;white-space:nowrap;font-family:'Roboto Mono',monospace;font-size:11.5px;color:var(--dim);animation:roll 60s linear infinite}
  .ticker:hover .ticker-track{animation-play-state:paused}
  .ticker-track b{color:var(--text);font-weight:600}
  .ticker-track .sc{color:var(--accent)}
  @keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  header{display:flex;align-items:baseline;justify-content:space-between;padding:18px 22px 0;gap:16px;flex-wrap:wrap}
  header h1{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;letter-spacing:.06em}
  header h1 span{color:var(--accent)}
  #clock{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim-2)}

  nav.views{display:flex;gap:2px;padding:14px 22px 0;border-bottom:1px solid var(--line)}
  nav.views button{background:none;border:0;color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;letter-spacing:.08em;padding:8px 16px 12px;border-bottom:2px solid transparent}
  nav.views button.on{color:var(--accent);border-bottom-color:var(--accent)}
  nav.views button:hover:not(.on){color:var(--text)}

  main{max-width:920px;margin:0 auto;padding:18px 22px 70px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#12151b}
  .chip:hover:not(.on){color:var(--text);border-color:var(--dim-2)}
  .chip.sm{padding:4px 11px;font-size:11.5px}
  .datenav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .datenav button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 11px;font-size:13px}
  .datenav button:hover{border-color:var(--accent-dim);color:var(--accent)}
  .datenav input[type=date]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 9px;font-family:'Roboto Mono',monospace;font-size:12px;color-scheme:dark}

  .daylabel{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.05em;margin:2px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .grouplabel{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1.6px;color:var(--accent-dim);text-transform:uppercase;margin:22px 0 9px}
  .grouplabel:first-child{margin-top:0}

  .game{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:7px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .12s,background .12s}
  .game:hover{border-color:var(--accent-dim);background:var(--panel-2)}
  .game.fav{border-left:3px solid var(--accent)}
  .rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .trow{display:flex;align-items:center;gap:9px}
  .logo{width:20px;height:20px;object-fit:contain;flex-shrink:0}
  .tname{font-size:13.5px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname.w{font-weight:700;color:#fff}
  .rec{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2);flex-shrink:0}
  .sc{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:700;min-width:30px;text-align:right;color:var(--dim)}
  .sc.w{color:var(--win)}
  .gmeta{text-align:right;flex-shrink:0;max-width:190px}
  .gstatus{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim);white-space:nowrap}
  .gstatus.live{color:var(--live);font-weight:700}
  .gstatus.live::before{content:"\25CF  "}
  .gsub{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--dim-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .msg{color:var(--dim);font-family:'Roboto Mono',monospace;font-size:12.5px;padding:26px 0;text-align:center}
  .msg.err{color:#f87171}

  .teampick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .teambtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600}
  .teambtn.on{border-color:var(--accent);color:var(--accent)}
  .teambtn:hover:not(.on){border-color:var(--dim-2)}
  .browse{display:flex;gap:8px;align-items:center;margin:14px 0 10px;flex-wrap:wrap}
  .browse select,.browse input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 10px;font-size:12.5px;font-family:inherit}
  .browse input{min-width:210px}

  .teamhero{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
  .teamhero img{width:52px;height:52px;object-fit:contain}
  .teamhero h2{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;letter-spacing:.03em}
  .teamhero .sub{font-family:'Roboto Mono',monospace;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.6}
  .resbadge{font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
  .resbadge.W{background:rgba(74,222,128,.14);color:var(--win)}
  .resbadge.L{background:rgba(239,118,118,.14);color:var(--loss)}
  .resbadge.T{background:rgba(124,135,151,.16);color:var(--dim)}

  .prow{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin-bottom:5px;display:flex;align-items:center;gap:11px;cursor:pointer}
  .prow:hover{border-color:var(--accent-dim);background:var(--panel-2)}
  .prow img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--panel-2);flex-shrink:0}
  .prow .jn{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--dim-2);min-width:26px}
  .prow .pn{font-size:13.5px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pd{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap}

  .backdrop{display:none;position:fixed;inset:0;background:rgba(4,6,9,.82);z-index:60;overflow-y:auto;padding:28px 14px}
  .backdrop.open{display:block}
  #pbackdrop{z-index:70;background:rgba(4,6,9,.88)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:790px;margin:0 auto;overflow:hidden}
  .mhead{padding:18px 20px 0;position:relative}
  .mclose{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--dim);font-size:26px;line-height:1;z-index:2}
  .mclose:hover{color:var(--text)}
  .mscore{display:flex;align-items:center;gap:16px;margin-bottom:12px}
  .mteam{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .mteam img{width:38px;height:38px;object-fit:contain}
  .mteam .n{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mteam .r{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2)}
  .mteam .p{font-family:'Roboto Mono',monospace;font-size:28px;font-weight:700}
  .mteam .p.w{color:var(--win)}
  .mmid{text-align:center;flex-shrink:0}
  .mmid .st{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--dim)}
  .mmid .st.live{color:var(--live);font-weight:700}
  .minfo{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim-2);line-height:1.7;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
  .mtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
  .mtabs button{background:none;border:0;color:var(--dim);font-size:12.5px;font-weight:600;padding:11px 13px;border-bottom:2px solid transparent;white-space:nowrap}
  .mtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .mtabs button:hover:not(.on){color:var(--text)}
  .mbody{padding:16px 20px 22px;max-height:66vh;overflow-y:auto}
  .subbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .subbar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}

  .sublabel{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1.4px;color:var(--accent-dim);text-transform:uppercase;margin:18px 0 8px}
  .sublabel:first-child{margin-top:0}
  .grptitle{font-size:11.5px;color:var(--dim);margin:14px 0 5px;font-weight:600}
  .tscroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px}
  table.st{width:100%;border-collapse:collapse;font-family:'Roboto Mono',monospace;font-size:11.5px;white-space:nowrap}
  table.st th{background:var(--panel-2);color:var(--dim);font-weight:500;padding:7px 9px;text-align:right}
  table.st td{padding:6px 9px;text-align:right;border-top:1px solid var(--line-soft)}
  table.st th:first-child,table.st td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);min-width:140px}
  table.st th:first-child{background:var(--panel-2)}
  table.st tr:hover td{background:var(--panel-2)}
  table.st .pos{color:var(--dim-2);font-size:10px}
  table.st tr.tot td{border-top:1px solid var(--line);color:var(--dim);font-weight:700}
  table.st.plain td:first-child,table.st.plain th:first-child{position:static;min-width:auto}
  table.st .lnk{color:var(--text);cursor:pointer}
  table.st .lnk:hover{color:var(--accent)}
  .linescore th,.linescore td{text-align:center}
  .linescore td:first-child,.linescore th:first-child{text-align:left;min-width:60px}

  .teamstat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
  .teamstat .lbl{color:var(--dim);font-size:11.5px;text-align:center;flex:1}
  .teamstat .v{font-family:'Roboto Mono',monospace;font-weight:600;min-width:64px}
  .teamstat .v.a{text-align:left}
  .teamstat .v.h{text-align:right}

  .play{padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;display:flex;gap:11px}
  .play .clk{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2);min-width:62px;flex-shrink:0;padding-top:2px}
  .play .txt{color:var(--dim);line-height:1.5}
  .play.score .txt{color:var(--text)}
  .play .pts{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--accent);margin-left:6px}

  /* player profile */
  .phero{display:flex;gap:16px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
  .phero img{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--panel-2);flex-shrink:0}
  .phero h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.03em;line-height:1.1}
  .phero .pmeta{font-family:'Roboto Mono',monospace;font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.65}
  .bio{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-top:6px}
  .bio div{background:var(--panel);padding:9px 11px}
  .bio .k{font-family:'Roboto Mono',monospace;font-size:9.5px;letter-spacing:1px;color:var(--dim-2);text-transform:uppercase}
  .bio .v{font-size:13px;margin-top:3px}

  footer{border-top:1px solid var(--line);text-align:center;padding:16px;font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2)}
  footer button{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:5px 11px;font-family:'Roboto Mono',monospace;font-size:10.5px;margin-top:7px}
  footer button:hover{color:var(--accent);border-color:var(--accent-dim)}

  @media(max-width:640px){
    .gmeta{max-width:120px}
    .mteam .p{font-size:22px}
    .datenav{margin-left:0;width:100%}
  }
</style>
</head>
<body>

<div class="ticker">
  <div class="ticker-tag">LIVE</div>
  <div class="ticker-track" id="tick"><span>Loading...</span></div>
</div>

<header>
  <h1 class="cond">SCORE<span>BOARD</span></h1>
  <div id="clock">&mdash;</div>
</header>

<nav class="views">
  <button class="on" data-view="scores">SCORES</button>
  <button data-view="teams">TEAMS</button>
  <button data-view="f1">F1</button>
</nav>

<main id="main"><div class="msg">Loading...</div></main>

<footer>
  Data via ESPN &middot; F1 via Jolpica-Ergast
  <br><button id="refresh">Refresh</button>
</footer>

<div class="backdrop" id="backdrop"><div class="modal"><div id="modalInner"></div></div></div>
<div class="backdrop" id="pbackdrop"><div class="modal"><div id="playerInner"></div></div></div>

<script>
/* ============================== CONFIG ============================== */
const LEAGUES = {
  nba:   {label:'NBA',     path:'basketball/nba',                     kind:'basketball'},
  nfl:   {label:'NFL',     path:'football/nfl',                       kind:'football'},
  ncaaf: {label:'CFB',     path:'football/college-football',          kind:'football',   extra:'&groups=80&limit=200'},
  ncaam: {label:'CBB',     path:'basketball/mens-college-basketball', kind:'basketball', extra:'&groups=50&limit=200'},
  fra1:  {label:'Ligue 1', path:'soccer/fra.1',                       kind:'soccer'},
  ucl:   {label:'UCL',     path:'soccer/uefa.champions',              kind:'soccer'}
};
const MY_TEAMS = [
  {name:'San Antonio Spurs',   short:'Spurs',       league:'nba',   id:'24'},
  {name:'Houston Texans',      short:'Texans',      league:'nfl',   id:'34'},
  {name:'Texas Longhorns',     short:'Texas FB',    league:'ncaaf', id:'251'},
  {name:'Oklahoma State',      short:'Ok State FB', league:'ncaaf', id:'197'},
  {name:'Texas Longhorns',     short:'Texas BB',    league:'ncaam', id:'251'},
  {name:'Oklahoma State',      short:'Ok State BB', league:'ncaam', id:'197'},
  {name:'Paris Saint-Germain', short:'PSG',         league:'fra1',  id:'160'}
];
const FAV_NAMES = ['San Antonio Spurs','Houston Texans','Texas Longhorns','Oklahoma State','Paris Saint-Germain'];

const API  = 'https://site.api.espn.com/apis/site/v2/sports';
const WEB  = 'https://site.web.api.espn.com/apis/common/v3/sports';
const F1_NEXT='https://api.jolpi.ca/ergast/f1/current/next.json';
const F1_DRV ='https://api.jolpi.ca/ergast/f1/current/driverStandings.json';
const F1_CON ='https://api.jolpi.ca/ergast/f1/current/constructorStandings.json';
const F1_LAST='https://api.jolpi.ca/ergast/f1/current/last/results.json';

/* ============================== STATE ============================== */
let view='scores', league='nba', dateObj=new Date();
let activeTeam=null, teamTab='schedule', showAllGames=false;
let teamCache={};                    // league -> team list
let modalData=null, modalTab='box', boxTeam=0, boxFilter='all', gameRosters=null;

/* ============================== UTIL ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s===null||s===undefined?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function get(u){ const r=await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function inputDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayLabel(d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const diff=Math.round((x-t)/86400000);
  const base=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  if(diff===0)return 'TODAY \u2014 '+base;
  if(diff===1)return 'TOMORROW \u2014 '+base;
  if(diff===-1)return 'YESTERDAY \u2014 '+base;
  return base.toUpperCase();
}
function gameTime(i){return new Date(i).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function gameTimeOnly(i){return new Date(i).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function isFav(n){return FAV_NAMES.some(f=>n&&n.toLowerCase().indexOf(f.toLowerCase())!==-1);}
function titleCase(s){return String(s||'').replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim();}
function num(v){return v===null||v===undefined?'':v;}
function teamName(t){ if(!t)return ''; return t.displayName||t.shortDisplayName||t.name||t.nickname||
  [t.location,t.name].filter(Boolean).join(' ')||t.abbreviation||''; }
function clock(){$('#clock').textContent=new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}

/* stat-group bucketing for the Offense / Defense / Special filter */
function bucketOf(name){
  const n=String(name||'').toLowerCase();
  if(/kick|punt|return/.test(n)) return 'special';
  if(/defens|interception|goalkeep|goalie|saves/.test(n)) return 'defense';
  if(/pass|rush|receiv|offens|fumble|scoring|shoot|batting/.test(n)) return 'offense';
  return 'other';
}

/* ============================== GAME CARD ============================== */
function gameCard(ev,lk){
  const comp=ev.competitions&&ev.competitions[0]; if(!comp)return '';
  const cs=comp.competitors||[];
  const home=cs.find(c=>c.homeAway==='home')||cs[0], away=cs.find(c=>c.homeAway==='away')||cs[1];
  if(!home||!away)return '';
  const st=comp.status&&comp.status.type&&comp.status.type.state;
  const live=st==='in', done=st==='post';
  const status=(comp.status&&comp.status.type&&comp.status.type.shortDetail)||'';
  const fav=isFav(teamName(home.team))||isFav(teamName(away.team));
  const bcast=(comp.broadcasts&&comp.broadcasts[0]&&comp.broadcasts[0].names&&comp.broadcasts[0].names.join('/'))||'';
  const venue=(comp.venue&&comp.venue.fullName)||'';
  const sub=st==='pre'?[venue,bcast].filter(Boolean).join(' \u00b7 '):venue;
  const row=(t,won)=>'<div class="trow">'+
    (t.team&&t.team.logo?'<img class="logo" src="'+esc(t.team.logo)+'" alt="">':'<div class="logo"></div>')+
    '<span class="tname '+(won?'w':'')+'">'+esc(teamName(t.team))+'</span>'+
    (t.records&&t.records[0]&&t.records[0].summary?'<span class="rec">'+esc(t.records[0].summary)+'</span>':'')+
    '<span class="sc '+(won?'w':'')+'">'+(st==='pre'?'':esc(num(t.score)))+'</span></div>';
  return '<div class="game '+(fav?'fav':'')+'" data-ev="'+esc(ev.id)+'" data-lg="'+esc(lk)+'">'+
    '<div class="rows">'+row(away,done&&away.winner)+row(home,done&&home.winner)+'</div>'+
    '<div class="gmeta"><div class="gstatus '+(live?'live':'')+'">'+esc(st==='pre'?gameTimeOnly(ev.date):status)+'</div>'+
    '<div class="gsub">'+esc(sub)+'</div></div></div>';
}
function wireCards(){document.querySelectorAll('.game').forEach(el=>{el.onclick=()=>openGame(el.dataset.ev,el.dataset.lg);});}

/* ============================== SCORES ============================== */
function renderScoresShell(){
  const chips=Object.keys(LEAGUES).map(k=>'<button class="chip '+(k===league?'on':'')+'" data-lg="'+k+'">'+LEAGUES[k].label+'</button>').join('');
  $('#main').innerHTML='<div class="controls"><div class="chips">'+chips+'</div>'+
    '<div class="datenav"><button id="prev">&lsaquo;</button>'+

async function loadScores(){
  const box=$('#games'), L=LEAGUES[league];
  try{
    const data=await get(API+'/'+L.path+'/scoreboard?dates='+ymd(dateObj)+(L.extra||''));
    const evs=data.events||[];
    if(!evs.length){box.innerHTML='<div class="msg">No '+L.label+' games on this date</div>';return;}
    evs.sort((a,b)=>{
      const f=e=>((e.competitions&&e.competitions[0]&&e.competitions[0].competitors)||[]).some(c=>isFav(teamName(c.team)))?0:1;
      const s=e=>(e.competitions&&e.competitions[0]&&e.competitions[0].status&&e.competitions[0].status.type.state)==='in'?0:1;
      return f(a)-f(b)||s(a)-s(b)||new Date(a.date)-new Date(b.date);
    });
    box.innerHTML=evs.map(e=>gameCard(e,league)).join('');
    wireCards();
  }catch(e){box.innerHTML='<div class="msg err">Couldn\'t load '+L.label+' for this date.</div>';}
}

async function loadTeamList(){
  const lg=$('#brLeague').value, note=$('#brNote'), dl=$('#teamlist');
  if(teamCache[lg]){ fillTeamList(teamCache[lg]); return; }
  note.textContent='loading teams...';
  const urls=[API+'/'+LEAGUES[lg].path+'/teams?limit=1000', API+'/'+LEAGUES[lg].path+'/teams'];
  for(const u of urls){
    try{
      const d=await get(u);
      let list=[];
      const sp=d.sports&&d.sports[0], lgs=sp&&sp.leagues&&sp.leagues[0];
      if(lgs&&lgs.teams) list=lgs.teams.map(x=>x.team||x);
      else if(d.teams) list=d.teams.map(x=>x.team||x);
      list=list.filter(t=>t&&t.id).sort((a,b)=>teamName(a).localeCompare(teamName(b)));
      if(list.length){ teamCache[lg]=list; fillTeamList(list); return; }
    }catch(e){}

  note.textContent='team list unavailable';
  dl.innerHTML='';

async function loadTeamSchedule(){
  const box=$('#ttBody'), t=activeTeam, base=API+'/'+LEAGUES[t.league].path+'/teams/'+t.id+'/schedule';
  try{
    const first=await get(base);
    const year=(first.season&&first.season.year)||new Date().getFullYear();
    // merge preseason(1) + regular(2) + postseason(3) so nothing is missing
    const extra=await Promise.all([1,2,3].map(st=>get(base+'?season='+year+'&seasontype='+st).catch(()=>null)));
    const seen={}, all=[];
    [first].concat(extra).forEach(d=>{
      ((d&&d.events)||[]).forEach(ev=>{ if(!seen[ev.id]){seen[ev.id]=1;all.push(ev);} });
    });
    all.sort((a,b)=>new Date(a.date)-new Date(b.date));
    const now=Date.now();
    const past=all.filter(e=>new Date(e.date)<now), future=all.filter(e=>new Date(e.date)>=now);
    const upNext=showAllGames?future:future.slice(0,8);
    const resShow=showAllGames?past.slice().reverse():past.slice().reverse().slice(0,8);

    let html='';
    if(future.length) html+='<div class="grouplabel">Upcoming ('+future.length+')</div>'+upNext.map(e=>teamRow(e,t)).join('');
    if(past.length)   html+='<div class="grouplabel">Results ('+past.length+')</div>'+resShow.map(e=>teamRow(e,t)).join('');
    if(!all.length)   html+='<div class="msg">No schedule published yet for '+year+'.</div>';
    if(!showAllGames && (future.length>8||past.length>8))
      html+='<div style="text-align:center;margin-top:14px"><button class="chip" id="showAll">Show full '+year+' schedule ('+all.length+' games)</button></div>';
    box.innerHTML=html;
    if($('#showAll')) $('#showAll').onclick=()=>{showAllGames=true;loadTeamSchedule();};
    wireCards();
  }catch(e){ box.innerHTML='<div class="msg err">Couldn\'t load the schedule.</div>'; }
}

function teamRow(ev,t){
  const comp=ev.competitions&&ev.competitions[0]; if(!comp)return '';
  const cs=comp.competitors||[];
  const me=cs.find(c=>c.team&&c.team.id===t.id)||cs[0], opp=cs.find(c=>c.team&&c.team.id!==t.id)||cs[1];
  if(!me||!opp)return '';
  const st=comp.status&&comp.status.type&&comp.status.type.state;
  const done=st==='post', live=st==='in', home=me.homeAway==='home';
  let badge='';
  if(done){const w=me.winner===true?'W':(opp.winner===true?'L':'T');badge='<span class="resbadge '+w+'">'+w+'</span>';}
  const sv=x=>(x&&x.score&&(x.score.displayValue!==undefined?x.score.displayValue:x.score))||'';
  const score=(done||live)?esc(sv(me))+'\u2013'+esc(sv(opp)):'';
  const venue=(comp.venue&&comp.venue.fullName)||'';
  const bc=(comp.broadcasts&&comp.broadcasts[0]&&comp.broadcasts[0].media&&comp.broadcasts[0].media.shortName)||'';
  const ol=opp.team&&opp.team.logos&&opp.team.logos[0]&&opp.team.logos[0].href;
  const note=(ev.notes&&ev.notes[0]&&ev.notes[0].headline)||'';
  return '<div class="game" data-ev="'+esc(ev.id)+'" data-lg="'+esc(t.league)+'"><div class="rows"><div class="trow">'+
    (ol?'<img class="logo" src="'+esc(ol)+'" alt="">':'<div class="logo"></div>')+
    '<span class="tname">'+(home?'vs':'@')+' '+esc(teamName(opp.team))+'</span>'+badge+
    '<span class="sc '+(done&&me.winner?'w':'')+'">'+score+'</span></div>'+
    (venue||note?'<div class="trow"><span class="gsub">'+esc([venue,note].filter(Boolean).join(' \u00b7 '))+'</span></div>':'')+
    '</div><div class="gmeta"><div class="gstatus '+(live?'live':'')+'">'+
    esc(live?comp.status.type.shortDetail:gameTime(ev.date))+'</div><div class="gsub">'+esc(bc)+'</div></div></div>';
}

/* ---------- Roster ---------- */
function normalizeRoster(d){
  const out=[]; const ath=d&&d.athletes;
  if(!ath) return out;
  if(Array.isArray(ath)&&ath.length&&ath[0].items) ath.forEach(g=>(g.items||[]).forEach(a=>out.push(a)));
  else if(Array.isArray(ath)) ath.forEach(a=>out.push(a.athlete||a));
  return out.filter(Boolean);
}
function playerRow(a,path){

/* ---- Box score with team switcher + offense/defense/special filter ---- */
function renderBox(data,kind){
  let html='';
  const comp=data.header&&data.header.competitions&&data.header.competitions[0];
  const cs=(comp&&comp.competitors)||[];
  const home=cs.find(c=>c.homeAway==='home'), away=cs.find(c=>c.homeAway==='away');
  if(home&&away&&home.linescores&&away.linescores&&home.linescores.length){
    const n=Math.max(home.linescores.length,away.linescores.length), heads=[];
    for(let i=1;i<=n;i++){
      if(kind==='soccer') heads.push(i===1?'1H':(i===2?'2H':'ET'));
      else if(kind==='basketball') heads.push(i<=4?('Q'+i):('OT'+(i-4)));
      else heads.push(i<=4?String(i):('OT'+(i-4)));
    }
    const rf=t=>{let c='';for(let i=0;i<n;i++){const l=t.linescores[i];
      c+='<td>'+esc(l?(l.displayValue!==undefined?l.displayValue:l.value):'-')+'</td>';}
      return '<tr><td>'+esc((t.team&&t.team.abbreviation)||'')+'</td>'+c+'<td><b>'+esc(num(t.score))+'</b></td></tr>';};
    html+='<div class="sublabel">Score by period</div><div class="tscroll"><table class="st linescore"><thead><tr><th></th>'+
      heads.map(x=>'<th>'+x+'</th>').join('')+'<th>T</th></tr></thead><tbody>'+rf(away)+rf(home)+'</tbody></table></div>';
  }

  const players=(data.boxscore&&data.boxscore.players)||[];
  if(!players.length) return html+'<div class="msg">Player stats aren\'t posted for this game yet.</div>';
  if(boxTeam>=players.length) boxTeam=0;

  const tb=players[boxTeam];
  const groups=(tb.statistics||[]).filter(g=>(g.athletes||[]).length);
  const buckets={}; groups.forEach(g=>buckets[bucketOf(g.name)]=1);
  const order=['offense','defense','special','other'];
  const labelFor={offense:'Offense',defense:'Defense',special:'Special Teams',other:'Other'};

  html+='<div class="subbar">'+
    players.map((p,i)=>'<button class="chip sm '+(i===boxTeam?'on':'')+'" data-bt="'+i+'">'+esc((p.team&&(p.team.abbreviation||teamName(p.team)))||('Team '+(i+1)))+'</button>').join('');
  const avail=order.filter(b=>buckets[b]);
  if(avail.length>1){
    html+='<span class="sep"></span><button class="chip sm '+(boxFilter==='all'?'on':'')+'" data-bf="all">All</button>'+
      avail.map(b=>'<button class="chip sm '+(boxFilter===b?'on':'')+'" data-bf="'+b+'">'+labelFor[b]+'</button>').join('');
  }
  html+='</div>';

  const show=groups.filter(g=>boxFilter==='all'||bucketOf(g.name)===boxFilter);
  if(!show.length) html+='<div class="msg">No '+(labelFor[boxFilter]||'')+' stats for this team.</div>';

  show.forEach(g=>{
    const labels=g.labels||g.keys||[], descs=g.descriptions||[];
    html+='<div class="grptitle">'+esc(g.text||titleCase(g.name||''))+'</div><div class="tscroll"><table class="st"><thead><tr><th>Player</th>'+
      labels.map((l,i)=>'<th title="'+esc(descs[i]||l)+'">'+esc(l)+'</th>').join('')+'</tr></thead><tbody>';
    (g.athletes||[]).forEach(a=>{
      const at=a.athlete||{}, ps=(at.position&&at.position.abbreviation)||'';
      html+='<tr><td><span class="lnk" data-aid="'+esc(at.id)+'" data-path="'+esc(modalData.path)+'">'+
        esc(at.displayName||at.shortName||'')+'</span>'+(ps?' <span class="pos">'+esc(ps)+'</span>':'')+'</td>'+
        (a.stats||[]).map(s=>'<td>'+esc(s)+'</td>').join('')+'</tr>';
    });
    if(g.totals&&g.totals.length) html+='<tr class="tot"><td>Total</td>'+g.totals.map(s=>'<td>'+esc(s)+'</td>').join('')+'</tr>';
    html+='</tbody></table></div>';
  });
  return html;
}
function wireBoxControls(){
  document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{boxTeam=+b.dataset.bt;drawModalBody();});
  document.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{boxFilter=b.dataset.bf;drawModalBody();});
}

/* ---- Rosters inside a game ---- */
async function renderGameRosters(){
  const el=$('#mbody'), data=modalData.data, path=modalData.path;
  const comp=data.header&&data.header.competitions&&data.header.competitions[0];
  const cs=(comp&&comp.competitors)||[];
  if(!cs.length){el.innerHTML='<div class="msg">No teams found for this game.</div>';return;}
  if(!gameRosters){
    el.innerHTML='<div class="msg">Loading rosters...</div>';
    try{
      gameRosters=await Promise.all(cs.map(c=>get(API+'/'+path+'/teams/'+c.team.id+'/roster').then(normalizeRoster).catch(()=>[])));
    }catch(e){ gameRosters=cs.map(()=>[]); }
  }
  let html='';
  cs.forEach((c,i)=>{
    const list=gameRosters[i]||[];
    html+='<div class="sublabel">'+esc(teamName(c.team))+' ('+list.length+')</div>';
    if(!list.length){ html+='<div class="msg">Roster unavailable.</div>'; return; }
    const grp={};
    list.forEach(a=>{const g=(a.position&&(a.position.parent&&a.position.parent.name))||(a.position&&a.position.name)||'Players';(grp[g]=grp[g]||[]).push(a);});
    Object.keys(grp).sort().forEach(g=>{
      html+='<div class="grptitle">'+esc(g)+'</div>'+grp[g].sort((x,y)=>(+x.jersey||999)-(+y.jersey||999)).map(a=>playerRow(a,path)).join('');
    });
  });
  el.innerHTML=html; wirePlayers();
}

/* ---- Team stats ---- */
function renderTeamStats(data){
  const teams=(data.boxscore&&data.boxscore.teams)||[];
  if(teams.length<2) return '<div class="msg">Team stats not available for this game.</div>';
  const a=teams[0].statistics||[], b=teams[1].statistics||[];
  if(!a.length) return '<div class="msg">Team stats not available for this game.</div>';
  let html='<div class="teamstat" style="border-bottom:1px solid var(--line)">'+
    '<span class="v a" style="color:var(--accent)">'+esc((teams[0].team&&teams[0].team.abbreviation)||'')+'</span><span class="lbl"></span>'+
    '<span class="v h" style="color:var(--accent)">'+esc((teams[1].team&&teams[1].team.abbreviation)||'')+'</span></div>';
  a.forEach((s,i)=>{
    const m=b.find(x=>x.name===s.name)||b[i];
    html+='<div class="teamstat"><span class="v a">'+esc(s.displayValue)+'</span><span class="lbl">'+
      esc(s.label||titleCase(s.name))+'</span><span class="v h">'+esc(m?m.displayValue:'')+'</span></div>';
  });
  return html;
}

/* ---- Plays ---- */
function renderPlays(data){
  const sc=data.scoringPlays||[], key=data.keyEvents||[], all=data.plays||[];
  let html='';
  if(sc.length) html+='<div class="sublabel">Scoring plays</div>'+sc.slice().reverse().map(p=>{
    const per=(p.period&&(p.period.displayValue||('Q'+p.period.number)))||'';
    const clk=[per,p.clock&&p.clock.displayValue].filter(Boolean).join(' ');
    const s=(p.awayScore!==undefined&&p.homeScore!==undefined)?(p.awayScore+'\u2013'+p.homeScore):'';
    return '<div class="play score"><span class="clk">'+esc(clk)+'</span><span class="txt">'+esc(p.text||'')+
      (s?'<span class="pts">'+esc(s)+'</span>':'')+'</span></div>';}).join('');
  if(key.length) html+='<div class="sublabel">Key events</div>'+key.slice().reverse().slice(0,30).map(p=>{
    const clk=(p.clock&&p.clock.displayValue)||'';
    const who=(p.athletesInvolved||[]).map(x=>x.displayName).join(', ');
    return '<div class="play"><span class="clk">'+esc(clk)+'</span><span class="txt">'+
      esc(p.text||(p.type&&p.type.text)||'')+(who?' \u2014 '+esc(who):'')+'</span></div>';}).join('');
  if(!sc.length&&!key.length&&all.length) html+='<div class="sublabel">Recent plays</div>'+all.slice(-45).reverse().map(p=>{
    const per=p.period&&p.period.number?'Q'+p.period.number:'';
    const clk=[per,p.clock&&p.clock.displayValue].filter(Boolean).join(' ');
    return '<div class="play '+(p.scoringPlay?'score':'')+'"><span class="clk">'+esc(clk)+'</span><span class="txt">'+esc(p.text||'')+'</span></div>';}).join('');
  return html||'<div class="msg">No play data for this game.</div>';
}

/* ---- Info ---- */
function renderInfo(data){
  let html='';
  if(data.leaders&&data.leaders.length){
    html+='<div class="sublabel">Game leaders</div>';
    data.leaders.forEach(t=>{(t.leaders||[]).forEach(cat=>{
      const top=cat.leaders&&cat.leaders[0]; if(!top)return;
      html+='<div class="teamstat"><span style="flex:1;text-align:left;font-size:12.5px"><span class="lnk" style="cursor:pointer" data-aid="'+
        esc(top.athlete&&top.athlete.id)+'" data-path="'+esc(modalData.path)+'">'+esc((top.athlete&&top.athlete.displayName)||'')+'</span>'+
        ' <span style="color:var(--dim-2);font-family:\'Roboto Mono\',monospace;font-size:10.5px">'+esc((t.team&&t.team.abbreviation)||'')+'</span></span>'+
        '<span style="font-family:\'Roboto Mono\',monospace;color:var(--dim);font-size:11.5px">'+esc(cat.displayName)+': '+esc(top.displayValue)+'</span></div>';
    });});
  }
  const gi=data.gameInfo||{};
  if(gi.officials&&gi.officials.length)
    html+='<div class="sublabel">Officials</div><div style="font-size:12.5px;color:var(--dim);line-height:1.8">'+
      gi.officials.map(o=>esc(o.displayName)+((o.position&&o.position.displayName)?' <span style="color:var(--dim-2)">('+esc(o.position.displayName)+')</span>':'')).join('<br>')+'</div>';
  if(data.injuries&&data.injuries.some(t=>t.injuries&&t.injuries.length)){
    html+='<div class="sublabel">Injuries</div>';
    data.injuries.forEach(t=>{
      if(!t.injuries||!t.injuries.length)return;
      html+='<div class="grptitle">'+esc((t.team&&t.team.abbreviation)||'')+'</div>'+
        t.injuries.map(i=>'<div class="play"><span class="txt">'+esc((i.athlete&&i.athlete.displayName)||'')+
          ' <span style="color:var(--dim-2)">\u2014 '+esc(i.status||'')+((i.details&&i.details.type)?' ('+esc(i.details.type)+')':'')+'</span></span></div>').join('');
    });
  }
  if(data.standings&&data.standings.groups&&data.standings.groups.length){
    html+='<div class="sublabel">Standings</div>';
    data.standings.groups.forEach(g=>{
      const en=(g.standings&&g.standings.entries)||[]; if(!en.length)return;
      html+='<div class="grptitle">'+esc(g.header||'')+'</div><div class="tscroll"><table class="st plain"><thead><tr>'+
        '<th style="text-align:left">Team</th><th>W</th><th>L</th><th>PCT</th></tr></thead><tbody>';
      en.forEach(e=>{
        const f=n=>{const s=(e.stats||[]).find(x=>x.name===n);return s?s.displayValue:'';};
        const nm=teamName(e.team)||e.note||'';
        html+='<tr><td style="text-align:left">'+esc(nm)+'</td><td>'+esc(f('wins'))+'</td><td>'+esc(f('losses'))+'</td><td>'+esc(f('winPercent'))+'</td></tr>';
      });
      html+='</tbody></table></div>';
    });
  }
  if(data.article&&data.article.headline)
    html+='<div class="sublabel">Recap</div><div style="font-size:13px;line-height:1.6;color:var(--dim)"><b style="color:var(--text)">'+
      esc(data.article.headline)+'</b><br>'+esc(data.article.description||'')+'</div>';
  const out=html||'<div class="msg">No extra info for this game.</div>';
  setTimeout(wirePlayers,0);
  return out;
}

/* ============================== F1 ============================== */
async function loadF1(){
  const m=$('#main'); m.innerHTML='<div class="msg">Loading F1...</div>';
  try{
    const r=await Promise.all([get(F1_NEXT).catch(()=>null),get(F1_DRV).catch(()=>null),get(F1_CON).catch(()=>null),get(F1_LAST).catch(()=>null)]);
    const next=r[0],drv=r[1],con=r[2],last=r[3];
    let html='';
    const race=next&&next.MRData&&next.MRData.RaceTable.Races[0];
    if(race){
      const dt=new Date(race.date+'T'+(race.time||'00:00:00Z'));
      html+='<div class="grouplabel">Next race \u2014 Round '+esc(race.round)+'</div><div class="teamhero"><div><h2 class="cond">'+
        esc(race.raceName)+'</h2><div class="sub">'+esc(race.Circuit.circuitName)+' \u00b7 '+esc(race.Circuit.Location.locality)+', '+
        esc(race.Circuit.Location.country)+'<br>'+esc(dt.toLocaleString('en-US',{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}))+'</div></div></div>';
      const ss=[['Practice 1',race.FirstPractice],['Practice 2',race.SecondPractice],['Practice 3',race.ThirdPractice],
        ['Sprint',race.Sprint],['Qualifying',race.Qualifying],['Race',{date:race.date,time:race.time}]].filter(s=>s[1]&&s[1].date);
      html+='<div class="tscroll"><table class="st plain"><thead><tr><th style="text-align:left">Session</th><th>Your local time</th></tr></thead><tbody>'+
        ss.map(s=>{const d=new Date(s[1].date+'T'+(s[1].time||'00:00:00Z'));
          return '<tr><td style="text-align:left">'+esc(s[0])+'</td><td>'+esc(d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))+'</td></tr>';}).join('')+'</tbody></table></div>';
    }
    const lr=last&&last.MRData&&last.MRData.RaceTable.Races[0];
    if(lr) html+='<div class="grouplabel">Last race \u2014 '+esc(lr.raceName)+'</div><div class="tscroll"><table class="st plain"><thead><tr>'+
      '<th style="text-align:left">Pos</th><th style="text-align:left">Driver</th><th style="text-align:left">Team</th><th>Time / Status</th><th>Pts</th></tr></thead><tbody>'+
      lr.Results.slice(0,15).map(x=>'<tr><td style="text-align:left">'+esc(x.position)+'</td><td style="text-align:left">'+
        esc(x.Driver.givenName+' '+x.Driver.familyName)+'</td><td style="text-align:left">'+esc(x.Constructor.name)+'</td><td>'+
        esc((x.Time&&x.Time.time)||x.status)+'</td><td>'+esc(x.points)+'</td></tr>').join('')+'</tbody></table></div>';
    const ds=drv&&drv.MRData&&drv.MRData.StandingsTable.StandingsLists[0];
    if(ds) html+='<div class="grouplabel">Driver standings</div><div class="tscroll"><table class="st plain"><thead><tr>'+
      '<th style="text-align:left">Pos</th><th style="text-align:left">Driver</th><th style="text-align:left">Team</th><th>Wins</th><th>Pts</th></tr></thead><tbody>'+
      ds.DriverStandings.map(d=>'<tr><td style="text-align:left">'+esc(d.position)+'</td><td style="text-align:left">'+
        esc(d.Driver.givenName+' '+d.Driver.familyName)+'</td><td style="text-align:left">'+esc((d.Constructors[0]||{}).name||'')+
        '</td><td>'+esc(d.wins)+'</td><td><b>'+esc(d.points)+'</b></td></tr>').join('')+'</tbody></table></div>';
    const cs2=con&&con.MRData&&con.MRData.StandingsTable.StandingsLists[0];
    if(cs2) html+='<div class="grouplabel">Constructor standings</div><div class="tscroll"><table class="st plain"><thead><tr>'+
      '<th style="text-align:left">Pos</th><th style="text-align:left">Team</th><th>Wins</th><th>Pts</th></tr></thead><tbody>'+
      cs2.ConstructorStandings.map(c=>'<tr><td style="text-align:left">'+esc(c.position)+'</td><td style="text-align:left">'+
        esc(c.Constructor.name)+'</td><td>'+esc(c.wins)+'</td><td><b>'+esc(c.points)+'</b></td></tr>').join('')+'</tbody></table></div>';
    m.innerHTML=html||'<div class="msg">No F1 data available right now.</div>';
  }catch(e){ m.innerHTML='<div class="msg err">Couldn\'t load F1 data.</div>'; }
}

/* ============================== TICKER ============================== */
async function loadTicker(){
  const el=$('#tick');
  try{
    const keys=['nba','nfl','ncaaf','fra1'], today=ymd(new Date());
    const res=await Promise.all(keys.map(k=>get(API+'/'+LEAGUES[k].path+'/scoreboard?dates='+today+(LEAGUES[k].extra||'')).catch(()=>({events:[]}))));
    const items=[];
    res.forEach(d=>{(d.events||[]).slice(0,12).forEach(ev=>{
      const c=ev.competitions&&ev.competitions[0]; if(!c)return;
      const cs=c.competitors||[], h=cs.find(x=>x.homeAway==='home'), a=cs.find(x=>x.homeAway==='away');
      if(!h||!a)return;
      const st=c.status&&c.status.type&&c.status.type.state;
      const v=st==='pre'?gameTimeOnly(ev.date):'<span class="sc">'+esc(num(a.score))+'-'+esc(num(h.score))+'</span> '+esc(c.status.type.shortDetail);
      items.push('<span><b>'+esc((a.team&&a.team.abbreviation)||'')+'</b>@<b>'+esc((h.team&&h.team.abbreviation)||'')+'</b> '+v+'</span>');
    });});
    el.innerHTML=items.length?items.join('')+items.join(''):'<span>No games today</span>';
  }catch(e){ el.innerHTML='<span>Ticker unavailable</span>'; }
}

/* ============================== ROUTER ============================== */
function render(){
  if(view==='scores'){renderScoresShell();loadScores();}
  else if(view==='teams'){renderTeamsShell();}
  else loadF1();
}
document.querySelectorAll('nav.views button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.views button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); view=b.dataset.view; render();
});
$('#refresh').onclick=()=>{render();loadTicker();};
$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal();};
$('#pbackdrop').onclick=e=>{if(e.target.id==='pbackdrop')closePlayer();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#pbackdrop').classList.contains('open')) closePlayer(); else closeModal(); return; }
  if(view!=='scores'||$('#backdrop').classList.contains('open'))return;
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(e.key==='ArrowLeft'){dateObj.setDate(dateObj.getDate()-1);renderScoresShell();loadScores();}
  if(e.key==='ArrowRight'){dateObj.setDate(dateObj.getDate()+1);renderScoresShell();loadScores();}
});
clock(); setInterval(clock,30000);
render(); loadTicker();
setInterval(()=>{ if(!$('#backdrop').classList.contains('open')&&!$('#pbackdrop').classList.contains('open')){render();loadTicker();} },60000);
</script>
