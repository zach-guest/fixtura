  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;gap:12px;flex-wrap:wrap}

  .datenav input[type=date]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 8px;font-family:'Roboto Mono',monospace;font-size:12px;max-width:150px}

  .daylabel{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;letter-spacing:.05em;margin:2px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}

  .gmeta{text-align:right;flex-shrink:0;max-width:180px}

  .gsub{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--dim-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .msg{color:var(--dim);font-family:'Roboto Mono',monospace;font-size:12.5px;padding:24px 0;text-align:center}

  .browse{display:flex;gap:8px;align-items:center;margin:12px 0 6px;flex-wrap:wrap}

  .teamhero{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}

  .favstar{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;margin-left:auto;flex-shrink:0}
  .favstar.on{border-color:var(--accent);color:var(--accent)}
  .resbadge{font-family:'Roboto Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}

  .resbadge.T{background:rgba(120,120,120,.18);color:var(--dim)}

  .prow{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:5px;display:flex;align-items:center;gap:10px;cursor:pointer}

  .prow .pn{font-size:13.5px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pd{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap}
  .prow.start{border-left:3px solid var(--accent)}
  .prow.inj{border-left:3px solid var(--live)}

  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;overflow-y:auto;padding:24px 12px}

  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:820px;margin:0 auto;overflow:hidden}

  .mtabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}

  .sublabel{font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:1.3px;color:var(--accent-dim);text-transform:uppercase;margin:18px 0 8px}
  .sublabel:first-child{margin-top:0}
  .grptitle{font-size:11.5px;color:var(--dim);margin:13px 0 5px;font-weight:600}
  .tscroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px}
  table.st{width:100%;border-collapse:collapse;font-family:'Roboto Mono',monospace;font-size:11.5px;white-space:nowrap}

  table.st th:first-child{background:var(--panel-2)}

  table.st tr.tot td{border-top:1px solid var(--line);color:var(--dim);font-weight:700}
  table.st.plain td:first-child,table.st.plain th:first-child{position:static;min-width:auto}
  table.st .lnk{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}

  table.st tr.click{cursor:pointer}
  table.st tr.click:hover td{background:var(--panel-2)}

  .teamstat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
  .teamstat .lbl{color:var(--dim);font-size:11.5px;text-align:center;flex:1}
  .teamstat .v{font-family:'Roboto Mono',monospace;font-weight:600;min-width:60px}
  .teamstat .v.a{text-align:left}.teamstat .v.h{text-align:right}

  .play{padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;display:flex;gap:10px}
  .play .clk{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2);min-width:58px;flex-shrink:0;padding-top:2px}
  .play .txt{color:var(--dim);line-height:1.5}
  .play.score .txt{color:var(--text)}
  .play .pts{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--accent);margin-left:6px}
  /* --- golf: course header, scorecard, hole difficulty --- */
  .gtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
  .gtabs button{background:none;border:0;color:var(--dim);font-size:12.5px;font-weight:600;
        padding:9px 14px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
  .gtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .gtabs button:hover{color:var(--text)}
  /* rows expand; say so rather than making people guess */
  .gcar{display:inline-block;width:9px;margin-right:7px;color:var(--dim-2);
        transition:transform .15s ease;transform-origin:50% 50%}

  .ghead{border:1px solid var(--line-soft);border-radius:8px;background:var(--panel-2);padding:11px 13px;margin-bottom:14px;
        display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
  .ghead .gitem{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2);letter-spacing:.4px}
  .ghead .gitem b{color:var(--text);font-size:12px;letter-spacing:0;margin-left:5px}
  .gwx{color:var(--accent)!important}
  .gexp{background:var(--panel-2)}
  .gexp>td{padding:0!important}
  .gwrap{padding:12px 13px;box-sizing:border-box;max-width:calc(100vw - 44px);overflow-x:auto}
  .gsc{width:100%;border-collapse:collapse;font-family:'Roboto Mono',monospace;font-size:10.5px}
  .gsc th,.gsc td{padding:3px 0;text-align:center;min-width:20px}
  .gsc th{color:var(--dim-2);font-weight:400;font-size:9.5px}
  .gsc .lbl{text-align:left;color:var(--dim-2);padding-right:8px;white-space:nowrap;font-size:9.5px}

  .gsc td.sc{color:var(--dim)}
  .gsc td.eag{color:var(--accent);font-weight:700}
  .gsc td.bir{color:var(--win);font-weight:600}
  .gsc td.bog{color:var(--loss)}

  .gstat{display:flex;flex-wrap:wrap;gap:5px 20px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}

  .gbar.easy{background:var(--win)}

  .gmove.dn{color:var(--loss)}
  .gmove.flat{color:var(--dim-2)}
  /* --- drive view: win probability + field --- */
  .wpwrap{border:1px solid var(--line-soft);border-radius:8px;padding:12px 12px 6px;background:var(--panel-2)}
  .wphead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .wpteam{font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.6px;color:var(--dim);display:flex;align-items:center;gap:5px}
  .wpteam img{width:15px;height:15px;object-fit:contain}
  .wpteam b{color:var(--text);font-size:13px;letter-spacing:0}
  .wpchart{width:100%;height:96px;display:block;overflow:visible}
  .wpchart .grid{stroke:var(--line);stroke-width:1}
  .wpchart .mid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
  .wpchart .fill{fill:var(--accent);opacity:.16}
  .wpchart .line{fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linejoin:round}
  .wpchart .dot{fill:var(--accent);stroke:var(--panel-2);stroke-width:2}
  .wpchart .sc{stroke:var(--dim-2);stroke-width:1;stroke-dasharray:2 3}
  .wpaxis{display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace;font-size:9.5px;color:var(--dim-2);letter-spacing:.5px;margin-top:2px}
  .wpbox{position:relative;cursor:crosshair}
  .wphit{position:absolute;inset:0;z-index:3}
  .wpcur{position:absolute;top:0;bottom:0;width:1px;background:var(--text);opacity:.45;pointer-events:none;display:none}
  .wpmark{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--text);pointer-events:none;display:none}

  .wptip .t{font-family:'Roboto Mono',monospace;font-size:9.5px;color:var(--dim-2);letter-spacing:.4px}

  .wptip .p{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.35}

  .field svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  .field .yd{stroke:var(--line-soft);stroke-width:1;opacity:.5;vector-effect:non-scaling-stroke}
  .field .yd5{stroke:var(--line-soft);stroke-width:1;opacity:.85;vector-effect:non-scaling-stroke}
  .field .los{stroke:var(--text);stroke-width:2;vector-effect:non-scaling-stroke}
  .field .fd{stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
  .field .fnum{position:absolute;bottom:9px;transform:translateX(-50%);font-family:'Roboto Mono',monospace;font-size:9px;color:var(--dim-2);opacity:.8}
  .field .fez{position:absolute;top:50%;font-family:'Roboto Mono',monospace;font-size:9px;font-weight:600;letter-spacing:1px;transform:translate(-50%,-50%);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.45)}
  /* Ball and gain bar are DOM, not SVG: the field stretches with
     preserveAspectRatio="none", which would squash an SVG circle into an ellipse.
     Being DOM also makes them animatable with a plain CSS transition. */
  .field .fgain{position:absolute;top:38%;height:7px;margin-top:-3.5px;border-radius:4px;background:var(--accent);opacity:.4;transition:left .55s cubic-bezier(.25,.9,.3,1),width .55s cubic-bezier(.25,.9,.3,1)}

  .field .fball{position:absolute;top:38%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--text);border:1.5px solid var(--panel);box-sizing:border-box;transition:left .55s cubic-bezier(.25,.9,.3,1);z-index:2}
  @media (prefers-reduced-motion:reduce){.field .fgain,.field .fball{transition:none}}
  .dnd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim)}

  .dnd .wpnow{color:var(--accent)}
  .drv{border-bottom:1px solid var(--line-soft);padding:10px 0}

  .drv .top .res{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.5px;color:var(--dim-2);text-transform:uppercase;flex-shrink:0}
  .drv .top .res.sc{color:var(--win)}
  .drv .top .who{font-family:inherit;font-size:11px;letter-spacing:0;color:var(--dim);text-transform:none;margin-left:6px}
  .drv .desc{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--dim-2);margin-top:3px}
  .drv .bar{position:relative;height:6px;border-radius:3px;background:var(--panel-2);margin-top:6px;overflow:hidden}
  .drv .bar span{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.55;border-radius:3px}
  .drv.open .desc{color:var(--dim)}

/* ========================= LEAGUES ========================= */

    {country:'Other',comps:[{k:'uefa.nations',label:'Nations League',core:1},{k:'fifa.worldq.uefa',label:'WC Qualifying (UEFA)'},
      {k:'fifa.worldq.conmebol',label:'WC Qualifying (CONMEBOL)'},{k:'fifa.friendly',label:'Friendlies'}]}
  ]
};
const LEAGUES={
  nfl:{label:'NFL',path:'football/nfl',kind:'football'},

  nhl:{label:'NHL',path:'hockey/nhl',kind:'hockey'}
};
['club','international'].forEach(m=>SOCCER_GROUPS[m].forEach(g=>g.comps.forEach(c=>{
  LEAGUES['soc:'+c.k]={label:c.label,path:'soccer/'+c.k,kind:'soccer'};
})));
const PRIMARY=[['nfl','NFL'],['ncaaf','CFB'],['nba','NBA'],['wnba','WNBA'],['ncaam','CBB'],['mlb','MLB'],['nhl','NHL'],['soccer','SOCCER']];

  {name:'San Antonio Spurs',short:'Spurs',league:'nba',id:'24'},

  {name:'Paris Saint-Germain',short:'PSG',league:'soc:fra.1',id:'160'}
];
// Tab row. VIEW_ORDER (persisted) holds the visible keys in display order; anything in
// VIEW_LABELS but not in VIEW_ORDER is simply hidden.
const VIEW_LABELS={scores:'SCORES',teams:'TEAMS',f1:'F1',golf:'GOLF',calendar:'CALENDAR'};
const DEFAULT_VIEWS=['scores','teams','f1','golf','calendar'];
const GOLF_TOURS=[['pga','PGA'],['lpga','LPGA'],['liv','LIV'],['eur','DP World'],
  ['champions-tour','Champions'],['ntw','Korn Ferry']];
const LIVE_SCAN=['nfl','ncaaf','nba','wnba','ncaam','mlb','nhl','soc:eng.1','soc:esp.1','soc:ger.1','soc:ita.1','soc:fra.1','soc:usa.1','soc:uefa.champions'];

const API='https://site.api.espn.com/apis/site/v2/sports';
const WEB='https://site.web.api.espn.com/apis/common/v3/sports';
const WEBSITE='https://site.web.api.espn.com/apis/site/v2/sports';
const CORE='https://sports.core.api.espn.com/v2';
const WIKI='https://en.wikipedia.org/w/api.php';
const GEO='https://geocoding-api.open-meteo.com/v1/search';
const WXAPI='https://api.open-meteo.com/v1/forecast';
const ERG='https://api.jolpi.ca/ergast/f1';
const WX_CODES={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',
 55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
 80:'Rain showers',81:'Rain showers',82:'Violent showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Severe thunderstorm'};
const BAD_IMG=/logo|icon|map\b|flag|crest|badge|commons|wiki|symbol|coat|arms|portal|question|ambox|edit|stub|disambig|padlock|seal|emblem|template|pictogram|dice|soccer_?ball|sports?.?(and|balls)|location|osm|compass|star_|arrow/i;

/* ========================= STATE ========================= */
let view='scores',league='nfl',socMode='club',socFilter='all',dateObj=new Date(),weekMode=false,liveMode=false;
let VIEW_ORDER=[],golfTour='pga',golfTab='board',golfOpen=null,golfData=null;
let activeTeam=null,teamTab='schedule',showAllGames=false,teamCache={},schedCache={};
let searchScope='all',allLeaguesLoading=false;
let modalData=null,modalTab='box',boxTeam=0,boxFilter='all',rosterTeam=0,lineupTeam=0,driveOpen=-1;
let gameRosters=null,venueHTML=null,autoRefresh=true,showCfg=false;
let MY_TEAMS=[],FAV_NAMES=[],TICKER_LEAGUES=[];
let calMonth=new Date(),calCache=null,f1Season=null,f1Open={};

/* ========================= UTIL ========================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function get(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function inputDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayKey(d){return inputDate(new Date(d));}
function dayLabel(d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const diff=Math.round((x-t)/86400000);
  const b=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  return diff===0?'TODAY \u2014 '+b:diff===1?'TOMORROW \u2014 '+b:diff===-1?'YESTERDAY \u2014 '+b:b.toUpperCase();
}
function weekBounds(d){const s=new Date(d);s.setDate(s.getDate()-s.getDay());const e=new Date(s);e.setDate(s.getDate()+6);return [s,e];}
function gameTime(i){return new Date(i).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function gameTimeOnly(i){return new Date(i).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function isFav(n){return FAV_NAMES.some(f=>n&&n.toLowerCase().indexOf(f.toLowerCase())!==-1);}
function titleCase(s){return String(s||'').replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim();}
function num(v){return v===null||v===undefined?'':v;}
function teamName(t){if(!t)return '';return t.displayName||t.shortDisplayName||t.name||t.nickname||[t.location,t.name].filter(Boolean).join(' ')||t.abbreviation||'';}
function sportSlug(lgKey){
  const L=LEAGUES[lgKey]||{},p=(L.path||'').split('/');
  if(p[0]==='soccer')return 'soccer';
  if(['nfl','nba','wnba','mlb','nhl'].indexOf(p[1])>=0)return p[1];
  return 'ncaa';
}
function logoOf(team,lgKey){
  if(!team)return '';
  if(team.logo)return team.logo;
  if(team.logos&&team.logos[0]&&team.logos[0].href)return team.logos[0].href;
  if(team.id&&lgKey)return 'https://a.espncdn.com/i/teamlogos/'+sportSlug(lgKey)+'/500/'+team.id+'.png';
  return '';
}
function oddsLine(comp){
  const o=comp&&comp.odds&&comp.odds[0];if(!o)return '';
  const bits=[];
  if(o.details)bits.push(o.details);
  if(o.overUnder!==undefined&&o.overUnder!==null)bits.push('O/U '+o.overUnder);
  return bits.join('  \u00b7  ');
}
function unslug(s){return String(s||'').split('-').map(w=>w?w[0].toUpperCase()+w.slice(1):'').join(' ');}
function initials(n){return String(n||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function clock(){$('#clock').textContent=new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function stamp(){$('#updated').textContent='Updated '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function modalOpen(){return $('#backdrop').classList.contains('open')||$('#pbackdrop').classList.contains('open');}

/* ---- settings persistence ---- */
function initSettings(){
  let s=null;try{const r=store('sb-favs');if(r)s=JSON.parse(r);}catch(e){}
  MY_TEAMS=Array.isArray(s)?s:DEFAULT_TEAMS.slice();syncFavNames();
  let t=null;try{const r=store('sb-ticker');if(r)t=JSON.parse(r);}catch(e){}
  TICKER_LEAGUES=Array.isArray(t)?t:DEFAULT_TICKER.slice();
  let v=null;try{const r=store('sb-views');if(r)v=JSON.parse(r);}catch(e){}
  // keep only keys that still exist, so removing a view can't strand a saved layout
  VIEW_ORDER=(Array.isArray(v)?v:DEFAULT_VIEWS.slice()).filter(k=>VIEW_LABELS[k]);
  if(!VIEW_ORDER.length)VIEW_ORDER=DEFAULT_VIEWS.slice();
  const last=store('sb-lastview');
  view=(last&&VIEW_ORDER.indexOf(last)>=0)?last:VIEW_ORDER[0];
  // ?view=golf&tour=lpga — lets a shared link open on a specific view instead of
  // whatever the recipient last had open. Beats "open it and click GOLF".
  try{
    const p=new URLSearchParams(location.search),qv=p.get('view'),qt=p.get('tour');
    if(qv&&VIEW_LABELS[qv]){
      view=qv;
      if(VIEW_ORDER.indexOf(qv)<0)VIEW_ORDER.unshift(qv);  // don't land on a hidden tab
    }
    if(qt&&GOLF_TOURS.some(t=>t[0]===qt))golfTour=qt;
  }catch(e){}
}
function saveViews(){try{store('sb-views',JSON.stringify(VIEW_ORDER));}catch(e){}}
function saveLastView(){try{store('sb-lastview',view);}catch(e){}}
function renderNav(){
  $('#viewNav').innerHTML=VIEW_ORDER.map(k=>'<button'+(view===k?' class="on"':'')+' data-view="'+k+'">'+
    esc(VIEW_LABELS[k])+'</button>').join('');
  document.querySelectorAll('#viewNav button').forEach(b=>b.onclick=()=>{
    view=b.dataset.view;saveLastView();renderNav();render();});
}
function markNav(){document.querySelectorAll('#viewNav button').forEach(x=>x.classList.toggle('on',x.dataset.view===view));}
function syncFavNames(){FAV_NAMES=MY_TEAMS.map(t=>t.name).filter(Boolean);}
function saveFavs(){try{store('sb-favs',JSON.stringify(MY_TEAMS));}catch(e){}syncFavNames();calCache=null;}
function saveTicker(){try{store('sb-ticker',JSON.stringify(TICKER_LEAGUES));}catch(e){}}
function favIndex(lg,id){return MY_TEAMS.findIndex(t=>t.league===lg&&String(t.id)===String(id));}
function toggleFav(t){
  const i=favIndex(t.league,t.id);
  if(i>=0)MY_TEAMS.splice(i,1);else MY_TEAMS.push({name:t.name,short:t.short||t.name,league:t.league,id:String(t.id),logo:t.logo||''});
  saveFavs();
}

/* ---- stat bucket + position ordering ---- */
const BUCKET_LABELS={offense:'Offense',defense:'Defense',special:'Special Teams',batting:'Batting',pitching:'Pitching',skaters:'Skaters',goalies:'Goalies',other:'Other'};
function bucketOf(name,kind){
  const n=String(name||'').toLowerCase();
  if(kind==='baseball')return /pitch/.test(n)?'pitching':'batting';
  if(kind==='hockey')return /goal(ie|tend|keep)/.test(n)?'goalies':'skaters';
  if(/kick|punt|return/.test(n))return 'special';
  if(/defen|interception|goalkeep|goalie|saves/.test(n))return 'defense';
  if(/pass|rush|receiv|offens|fumble|scoring|shoot/.test(n))return 'offense';
  return 'other';
}
function groupRank(name,kind){
  const n=String(name||'').toLowerCase();
  if(kind==='soccer')return /goal|keeper/.test(n)?0:/defen|back/.test(n)?1:/mid/.test(n)?2:/forward|strik|attack|wing/.test(n)?3:4;
  if(kind==='football')return /offen/.test(n)?0:/defen/.test(n)?1:/special/.test(n)?2:3;
  if(kind==='basketball')return /guard/.test(n)?0:/forward/.test(n)?1:/cent/.test(n)?2:3;
  if(kind==='baseball')return /pitch/.test(n)?0:/catch/.test(n)?1:/infield|base|short/.test(n)?2:/outfield/.test(n)?3:4;
  if(kind==='hockey')return /forward|center|wing/.test(n)?0:/defen/.test(n)?1:/goal/.test(n)?2:3;
  return 0;
}

/* ========================= THEME ========================= */
(function(){
  const saved=store('sb-theme')||'paper';
  document.documentElement.setAttribute('data-theme',saved);
  const s=$('#theme');s.value=saved;
  s.onchange=()=>{document.documentElement.setAttribute('data-theme',s.value);store('sb-theme',s.value);};

/* ========================= GAME CARD ========================= */
function gameCard(ev,lk){
  const comp=ev.competitions&&ev.competitions[0];if(!comp)return '';
  const cs=comp.competitors||[];
  const home=cs.find(c=>c.homeAway==='home')||cs[0],away=cs.find(c=>c.homeAway==='away')||cs[1];
  if(!home||!away)return '';
  const st=comp.status&&comp.status.type&&comp.status.type.state,live=st==='in',done=st==='post';
  const status=(comp.status&&comp.status.type&&comp.status.type.shortDetail)||'';
  const fav=isFav(teamName(home.team))||isFav(teamName(away.team));
  const bc=(comp.broadcasts&&comp.broadcasts[0]&&comp.broadcasts[0].names&&comp.broadcasts[0].names.join('/'))||'';
  const venue=(comp.venue&&comp.venue.fullName)||'';
  const ln=oddsLine(comp);

    '<span class="tname '+(w?'w':'')+'">'+esc(teamName(t.team))+'</span>'+
    (t.records&&t.records[0]&&t.records[0].summary?'<span class="rec">'+esc(t.records[0].summary)+'</span>':'')+
    '<span class="sc '+(w?'w':'')+'">'+(st==='pre'?'':esc(num(t.score)))+'</span></div>';
  return '<div class="game '+(fav?'fav':'')+'" data-ev="'+esc(ev.id)+'" data-lg="'+esc(lk)+'">'+
    '<div class="rows">'+row(away,done&&away.winner)+row(home,done&&home.winner)+
    (ln?'<div class="trow"><span class="odds">'+esc(ln)+'</span></div>':'')+'</div>'+
    '<div class="gmeta"><div class="gstatus '+(live?'live':'')+'">'+esc(st==='pre'?gameTimeOnly(ev.date):status)+'</div>'+
    '<div class="gsub">'+esc(st==='pre'?[venue,bc].filter(Boolean).join(' \u00b7 '):venue)+'</div></div></div>';
}

function sortEvents(e){return e.sort((a,b)=>{
  const f=x=>((x.competitions&&x.competitions[0]&&x.competitions[0].competitors)||[]).some(c=>isFav(teamName(c.team)))?0:1;
  const s=x=>(x.competitions&&x.competitions[0]&&x.competitions[0].status&&x.competitions[0].status.type.state)==='in'?0:1;
  return f(a)-f(b)||s(a)-s(b)||new Date(a.date)-new Date(b.date);});}

const SEARCH_LEAGUES=['nfl','ncaaf','nba','wnba','ncaam','ncaaw','mlb','nhl',
  'soc:eng.1','soc:esp.1','soc:ger.1','soc:ita.1','soc:fra.1','soc:usa.1','soc:uefa.champions'];

function slimTeam(t){return {id:String(t.id),displayName:teamName(t),
  shortDisplayName:t.shortDisplayName||'',abbreviation:t.abbreviation||''};}
function cacheKey(lg){return 'sb-teams-'+lg;}
function readTeamCache(lg){
  try{
    const raw=store(cacheKey(lg));if(!raw)return null;
    const o=JSON.parse(raw);
    if(!o||!o.t||!o.list||Date.now()-o.t>30*86400000)return null;
    return o.list;
  }catch(e){return null;}
}
function writeTeamCache(lg,list){try{store(cacheKey(lg),JSON.stringify({t:Date.now(),list:list}));}catch(e){}}

/* pull every team out of the core API, following its pagination */
async function coreTeams(L,onProgress){
  const p=L.path.split('/'),out=[];
  let page=1,pages=1;
  while(page<=pages&&page<=8){
    const d=await get(CORE+'/sports/'+p[0]+'/leagues/'+p[1]+'/teams?limit=100&page='+page);
    pages=d.pageCount||1;
    const refs=(d.items||[]).map(x=>x&&x.$ref).filter(Boolean);
    if(!refs.length)break;
    for(let i=0;i<refs.length;i+=40){
      const b=await Promise.all(refs.slice(i,i+40).map(u=>get(u.replace('http://','https://')).catch(()=>null)));
      b.filter(Boolean).forEach(t=>{if(t.id)out.push(t);});
      if(onProgress)onProgress(out.length);
    }
    page++;
  }
  return out;
}
async function ensureTeams(lg,onProgress){
  if(teamCache[lg])return teamCache[lg];
  const cached=readTeamCache(lg);
  if(cached&&cached.length){teamCache[lg]=cached;return cached;}
  const L=LEAGUES[lg];if(!L)return [];
  // fast paths first
  for(const u of [API+'/'+L.path+'/teams?limit=1000',API+'/'+L.path+'/teams']){
    try{
      const d=await get(u);
      let list=[];
      const sp=d.sports&&d.sports[0],lgs=sp&&sp.leagues&&sp.leagues[0];
      if(lgs&&lgs.teams)list=lgs.teams.map(x=>x.team||x);
      else if(d.teams)list=d.teams.map(x=>x.team||x);
      list=dedupeTeams(list).map(slimTeam);
      if(list.length>1){teamCache[lg]=list;writeTeamCache(lg,list);return list;}
    }catch(e){}
  }
  // slow but reliable path
  try{
    const raw=await coreTeams(L,onProgress);
    const list=dedupeTeams(raw).map(slimTeam);
    if(list.length){teamCache[lg]=list;writeTeamCache(lg,list);return list;}
  }catch(e){}
  return [];
}
function dedupeTeams(list){
  const seen={};
  return (list||[]).filter(t=>{if(!t||!t.id||seen[t.id])return false;seen[t.id]=1;return true;})
    .sort((a,b)=>teamName(a).localeCompare(teamName(b)));
}
async function loadTeamList(force){
  const sel=$('#brLeague');if(!sel)return;
  const lg=sel.value,note=$('#brNote');
  if(lg==='all'){
    const have=SEARCH_LEAGUES.filter(k=>teamCache[k]||readTeamCache(k)).length;
    note.textContent=have+'/'+SEARCH_LEAGUES.length+' leagues ready';
    SEARCH_LEAGUES.forEach(k=>{const c=readTeamCache(k);if(c&&!teamCache[k])teamCache[k]=c;});
    runSearch();
    return;
  }
  if(force)delete teamCache[lg];
  const L=LEAGUES[lg];if(!L){note.textContent='';return;}
  if(teamCache[lg]){note.textContent=teamCache[lg].length+' teams';runSearch();return;}
  note.textContent='loading teams\u2026';
  const list=await ensureTeams(lg,n=>{note.textContent='loading teams\u2026 '+n;});
  note.innerHTML=list.length?(list.length+' teams'):
    (esc(L.label)+' list unavailable <button class="chip sm" id="tlRetry" style="padding:2px 8px">Retry</button>');
  if($('#tlRetry'))$('#tlRetry').onclick=()=>loadTeamList(true);
  runSearch();
}
async function loadAllLeagues(){
  const note=$('#brNote');
  for(let i=0;i<SEARCH_LEAGUES.length;i++){
    const k=SEARCH_LEAGUES[i];
    if(note)note.textContent='loading '+LEAGUES[k].label+' ('+(i+1)+'/'+SEARCH_LEAGUES.length+')\u2026';
    await ensureTeams(k);
    if($('#brLeague')&&$('#brLeague').value==='all')runSearch(true);
  }
  if(note)note.innerHTML='all leagues ready';
}
function runSearch(quiet){
  const inp=$('#brSearch');if(!inp)return;
  const scope=$('#brLeague').value,q=inp.value.trim().toLowerCase(),hits=$('#hits');
  if(q.length<2){hits.innerHTML='';return;}
  const scopes=scope==='all'?SEARCH_LEAGUES:[scope];
  const m=[];
  scopes.forEach(k=>{
    (teamCache[k]||[]).forEach(t=>{
      const n=teamName(t).toLowerCase();
      if(n.indexOf(q)!==-1||String(t.abbreviation||'').toLowerCase().indexOf(q)===0)m.push({t:t,lg:k});
    });
  });
  m.sort((a,b)=>{
    const an=teamName(a.t).toLowerCase(),bn=teamName(b.t).toLowerCase();
    return (an.indexOf(q)-bn.indexOf(q))||an.localeCompare(bn);
  });
  const top=m.slice(0,15);

async function fetchTeamEvents(t){
  const L=LEAGUES[t.league];if(!L)return {events:[],year:''};
  const base=API+'/'+L.path+'/teams/'+t.id+'/schedule';
  const seen={},all=[];
  const add=d=>((d&&d.events)||[]).forEach(ev=>{if(ev&&ev.id&&!seen[ev.id]){seen[ev.id]=1;all.push(ev);}});

  let year=null;
  try{const first=await get(base);add(first);year=(first.season&&first.season.year)||null;}catch(e){}

  // if the default call already returned fixtures, only fill in that same season's other phases
  if(all.length){
    if(L.kind!=='soccer'&&year){
      const more=await Promise.all([1,2,3].map(s=>get(base+'?season='+year+'&seasontype='+s).catch(()=>null)));
      more.forEach(add);
    }
    all.sort((a,b)=>new Date(a.date)-new Date(b.date));
    return {events:all,year:year||''};
  }

  // nothing came back: guess at the season year (soccer seasons start mid-year)
  const now=new Date();
  const guess=now.getMonth()>=6?now.getFullYear():now.getFullYear()-1;
  const years=[guess,guess+1,now.getFullYear()].filter((v,i,a)=>a.indexOf(v)===i);
  const jobs=[];
  years.forEach(y=>{
    jobs.push(get(base+'?season='+y).catch(()=>null));
    if(L.kind!=='soccer')[1,2,3].forEach(s=>jobs.push(get(base+'?season='+y+'&seasontype='+s).catch(()=>null)));
  });
  (await Promise.all(jobs)).forEach(add);

  // last resort: sweep the league scoreboard across date ranges and pull this team's fixtures out
  if(!all.length){
    const base2=new Date();
    const chunks=[[-60,-1],[0,59],[60,119],[120,179]];
    const res=await Promise.all(chunks.map(c=>{
      const a=new Date(base2);a.setDate(a.getDate()+c[0]);
      const b=new Date(base2);b.setDate(b.getDate()+c[1]);
      return get(API+'/'+L.path+'/scoreboard?dates='+ymd(a)+'-'+ymd(b)+(L.extra||'')).catch(()=>null);
    }));
    res.forEach(d=>((d&&d.events)||[]).forEach(ev=>{
      const cs=(ev.competitions&&ev.competitions[0]&&ev.competitions[0].competitors)||[];
      if(cs.some(c=>c.team&&String(c.team.id)===String(t.id))&&!seen[ev.id]){seen[ev.id]=1;all.push(ev);}
    }));
  }
  all.sort((a,b)=>new Date(a.date)-new Date(b.date));
  return {events:all,year:year||guess};
}

// Bulk headshot lookup for rosters ESPN has no photos for (soccer, mostly).
// Wikipedia takes up to 50 titles per request, so a whole squad costs one call.
// A name alone can resolve to the wrong person, so a photo is only accepted when the
// page's Wikidata description matches the sport. Ambiguous names land on disambiguation
// pages, which carry no image anyway — those fall back to initials.
const KIND_DESC={soccer:/footbal|soccer/,football:/football/,basketball:/basketball/,
  baseball:/baseball/,hockey:/hockey/};
const wikiRosterCache={};
async function wikiPhotosFor(names,kind){
  const want=KIND_DESC[kind],need=[];
  names.forEach(n=>{if(n&&wikiRosterCache[n]===undefined&&need.indexOf(n)<0)need.push(n);});
  for(let i=0;i<need.length;i+=50){
    const chunk=need.slice(i,i+50);
    try{
      const d=await get(WIKI+'?action=query&format=json&origin=*&redirects=1&prop=pageimages%7Cpageterms'+
        '&piprop=thumbnail&pithumbsize=200&wbptterms=description&titles='+encodeURIComponent(chunk.join('|')));
      const q=d.query||{},alias={},byTitle={};
      (q.normalized||[]).forEach(x=>{alias[x.from]=x.to;});
      (q.redirects||[]).forEach(x=>{alias[x.from]=x.to;});
      const pg=q.pages||{};
      Object.keys(pg).forEach(k=>{byTitle[pg[k].title]=pg[k];});
      chunk.forEach(n=>{
        let t=n;for(let h=0;h<4&&alias[t];h++)t=alias[t];   // requested -> normalized -> redirected
        const p=byTitle[t],desc=((p&&p.terms&&p.terms.description)||[''])[0].toLowerCase();
        wikiRosterCache[n]=(p&&p.thumbnail&&(!want||want.test(desc)))?p.thumbnail.source:null;
      });
    }catch(e){chunk.forEach(n=>{wikiRosterCache[n]=null;});}
  }
}
async function fillRosterPhotos(kind){
  const slots=Array.prototype.slice.call(document.querySelectorAll('.prow .ph[data-nm]'));
  if(!slots.length)return;
  await wikiPhotosFor(slots.map(s=>s.dataset.nm),kind);
  slots.forEach(s=>{
    const u=wikiRosterCache[s.dataset.nm];
    if(u&&s.parentNode)s.outerHTML='<img src="'+esc(u)+'" alt="" onerror="this.style.visibility=\'hidden\'">';
  });
}
function rosterHTML(list,path,kind){
  const g={};list.forEach(a=>{const k=posGroup(a);(g[k]=g[k]||[]).push(a);});
  return Object.keys(g).sort((a,b)=>groupRank(a,kind)-groupRank(b,kind)||a.localeCompare(b))
    .map(k=>'<div class="grptitle">'+esc(k)+' ('+g[k].length+')</div>'+
      g[k].sort((x,y)=>(+x.jersey||999)-(+y.jersey||999)).map(a=>playerRow(a,path)).join('')).join('');
}

/* ========================= PLAYER PROFILE ========================= */
// Wikipedia's own search, with go=Go: jumps straight to the article when the name is an
// exact title match, otherwise shows results. Never points at the wrong person.
function wikiSearchUrl(name){
  return 'https://en.wikipedia.org/w/index.php?title=Special:Search&go=Go&search='+encodeURIComponent(name);
}
function wikiArticleUrl(title){
  return 'https://en.wikipedia.org/wiki/'+encodeURIComponent(String(title).replace(/ /g,'_'));
}
const wikiPhotoCache={};
// Returns {url,title} — url may be null when the page has no thumbnail, but the title is
// still worth having for the profile link. Null only when the lookup itself failed.
async function wikiPhoto(name,hint){
  const key=name+'|'+hint;
  if(wikiPhotoCache[key]!==undefined)return wikiPhotoCache[key];
  try{
    const s=await get(WIKI+'?action=query&generator=search&gsrsearch='+encodeURIComponent(name+' '+hint)+
      '&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=400&format=json&origin=*');
    const pg=s.query&&s.query.pages,k=pg&&Object.keys(pg)[0];
    const hit=k?{url:(pg[k].thumbnail&&pg[k].thumbnail.source)||null,title:pg[k].title||null}:null;
    wikiPhotoCache[key]=hit;return hit;
  }catch(e){wikiPhotoCache[key]=null;return null;}
}
async function openPlayer(id,path){
  if(!id)return;
  $('#pbackdrop').classList.add('open');document.body.style.overflow='hidden';
  $('#playerInner').innerHTML='<div class="mhead"><button class="mclose" onclick="closePlayer()">&times;</button></div><div class="msg">Loading profile\u2026</div>';
  const p=path.split('/'),coreUrl=CORE+'/sports/'+p[0]+'/leagues/'+p[1]+'/athletes/'+id;
  try{
    const r=await Promise.all([get(WEB+'/'+path+'/athletes/'+id).catch(()=>null),
      get(WEB+'/'+path+'/athletes/'+id+'/bio').catch(()=>null),
      get(WEB+'/'+path+'/athletes/'+id+'/stats').catch(()=>null),
      get(coreUrl).catch(()=>null)]);
    const base=r[0]||{},a=Object.assign({},r[3]||{},base.athlete||base);
    let college='';
    const cref=r[3]&&r[3].college&&r[3].college.$ref;
    if(cref){try{const c=await get(cref.replace('http://','https://'));college=c.name||c.shortName||'';}catch(e){}}
    $('#playerInner').innerHTML=renderPlayer(a,r[2],r[1],college);

      const hint=p[0]==='soccer'?'footballer':(a.team?teamName(a.team):p[1]);
      const hit=await wikiPhoto(a.fullName||a.displayName||'',hint);
      const slot=$('#pPhoto');

      // we resolved a real article, so upgrade the search link to point straight at it

}

function periodHeads(kind,n){
  const h=[];
  for(let i=1;i<=n;i++){
    if(kind==='soccer')h.push(i===1?'1H':i===2?'2H':'ET');
    else if(kind==='basketball')h.push(i<=4?'Q'+i:'OT'+(i-4));
    else if(kind==='hockey')h.push(i<=3?'P'+i:(i===4?'OT':'SO'));
    else if(kind==='baseball')h.push(String(i));
    else h.push(i<=4?String(i):'OT'+(i-4));
  }
  return h;
}

/* ---- lineups ---- */
function isStarter(r){if(r.starter===true)return true;if(r.starter===false)return false;return +(r.formationPlace||0)>0;}
function flatAthlete(r){const a=Object.assign({},r.athlete||r);
  if(!a.jersey&&r.jersey)a.jersey=r.jersey;if(r.position)a.position=r.position;return a;}
function posAbbr(r){const a=r.athlete||r,p=r.position||a.position||{};return String(p.abbreviation||p.name||'').toUpperCase();}
/* split a match position like "CD-L", "RWB", "AM-R" into its base role and which flank it sits on */
function parsePos(ab){
  let a=String(ab||'').toUpperCase().trim(),side=0;
  if(/-L$/.test(a)){side=-1;a=a.replace(/-L$/,'');}
  else if(/-R$/.test(a)){side=1;a=a.replace(/-R$/,'');}
  else if(/^L./.test(a)){side=-1;a=a.slice(1);}
  else if(/^R./.test(a)){side=1;a=a.slice(1);}
  return {base:a.replace(/-/g,''),side:side};
}
function lineOf(ab){
  const b=parsePos(ab).base;
  if(!b)return 'M';
  if(/^G/.test(b))return 'G';
  if(/^(WB|FB|B|CB|CD|D|SW)$/.test(b))return 'D';   // exact matches so DM doesn't get read as D
  if(/M$/.test(b))return 'M';                        // DM, CM, AM, M
  if(/^(F|ST|CF|W|SS|A|CA)$/.test(b))return 'F';
  return 'M';
}
/* wide roles sit further from centre than central ones, so full-backs go outside centre-backs */
function lateral(ab){
  const p=parsePos(ab);
  const wide=/^(B|WB|FB|W|M)$/.test(p.base)?2:1;
  return p.side*wide;
}
/* how advanced a midfielder is, used to split one midfield block into formation rows */
function attackRank(ab){
  const b=parsePos(ab).base;
  if(b==='DM'||b==='CDM')return 0;
  if(/^A/.test(b))return 2;
  return 1;
}
async function renderLineups(){
  const el=$('#mbody'),data=modalData.data,path=modalData.path,kind=modalData.kind;
  const comp=data.header&&data.header.competitions&&data.header.competitions[0],cs=(comp&&comp.competitors)||[];
  if(!cs.length){el.innerHTML='<div class="msg">No lineup data.</div>';return;}
  if(lineupTeam>=cs.length)lineupTeam=0;
  let src=data.rosters||null;
  if(!src&&data.boxscore&&data.boxscore.players){
    src=data.boxscore.players.map(tb=>{
      const seen={},roster=[];
      (tb.statistics||[]).forEach(g=>(g.athletes||[]).forEach(a=>{
        const id=a.athlete&&a.athlete.id;if(!id||seen[id])return;seen[id]=1;
        roster.push({athlete:a.athlete,starter:a.starter===true,position:a.athlete&&a.athlete.position,jersey:a.athlete&&a.athlete.jersey});}));
      return {team:tb.team,roster:roster};});
  }
  if(!src||!src.length){el.innerHTML='<div class="msg">No confirmed lineup published yet. The Rosters tab has the full squad.</div>';return;}
  let html='<div class="subbar">'+cs.map((c,i)=>'<button class="chip sm '+(i===lineupTeam?'on':'')+'" data-lt="'+i+'">'+
    esc(teamName(c.team))+'</button>').join('')+'</div>';
  const blk=src[lineupTeam]||src[0],roster=(blk&&(blk.roster||blk.athletes))||[];
  if(!roster.length){el.innerHTML=html+'<div class="msg">No lineup for this team.</div>';
    document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{lineupTeam=+b.dataset.lt;renderLineups();});return;}
  let starters=roster.filter(isStarter).sort((a,b)=>(+a.formationPlace||99)-(+b.formationPlace||99));
  let bench=roster.filter(r=>!isStarter(r));
  const cap=kind==='soccer'?11:(kind==='basketball'?5:null);
  if(cap&&starters.length>cap){bench=starters.slice(cap).concat(bench);starters=starters.slice(0,cap);}
  const formation=blk.formation||'';
  if(kind==='soccer'&&starters.length>=7)html+=pitchHTML(starters,formation,path);
  if(formation)html+='<div class="grptitle">Formation: '+esc(formation)+'</div>';
  if(starters.length)html+='<div class="sublabel">Starting '+(kind==='soccer'?'XI':'lineup')+' ('+starters.length+')</div>'+
    starters.map(r=>playerRow(flatAthlete(r),path,'start')).join('');
  if(bench.length)html+='<div class="sublabel">'+(kind==='soccer'?'Substitutes':'Bench')+' ('+bench.length+')</div>'+
    bench.map(r=>playerRow(flatAthlete(r),path)).join('');
  el.innerHTML=html;
  document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{lineupTeam=+b.dataset.lt;renderLineups();});
  wirePlayers();
}
function pitchHTML(starters,formation,path){
  const fp=r=>+(r.formationPlace||0);
  const grab=k=>starters.filter(r=>lineOf(posAbbr(r))===k);
  const G=grab('G'),D=grab('D'),F=grab('F');
  // order midfielders holding -> attacking so a 4-2-3-1 splits into the right two bands
  const M=grab('M').sort((a,b)=>attackRank(posAbbr(a))-attackRank(posAbbr(b))||fp(a)-fp(b));
  const parts=String(formation||'').split('-').map(Number).filter(n=>n>0);
  let rows;
  if(parts.length>=3&&parts[0]===D.length&&parts[parts.length-1]===F.length&&
     parts.slice(1,-1).reduce((s,n)=>s+n,0)===M.length){
    rows=[G,D];let i=0;parts.slice(1,-1).forEach(n=>{rows.push(M.slice(i,i+n));i+=n;});rows.push(F);
  }else{
    rows=[G,D,M,F];
  }
  rows=rows.filter(r=>r&&r.length).map(r=>r.slice().sort((a,b)=>lateral(posAbbr(a))-lateral(posAbbr(b))||fp(a)-fp(b)));
  const cell=r=>{
    const a=r.athlete||r,seg=String(a.shortName||a.displayName||'').split(' ');
    return '<div class="pp" data-aid="'+esc(a.id)+'" data-path="'+esc(path)+'">'+
      '<div class="num">'+esc(a.jersey||r.jersey||'')+'</div><div class="nm">'+esc(seg[seg.length-1]||'')+'</div>'+
      '<div class="ab">'+esc(posAbbr(r))+'</div></div>';};
  return '<div class="pitch">'+rows.slice().reverse().map(r=>'<div class="pline">'+r.map(cell).join('')+'</div>').join('')+'</div>';
}

/* ===== DRIVE VIEW =====
   Live drive chart + win probability, built entirely from the summary?event= payload
   the modal already fetches. ESPN ships `winprobability` (one entry per play) and
   `drives` (current + previous, plays inline) in that same response.
   Note: ESPN gives win probability but NOT EPA — there is no expected-points field
   anywhere in this feed, so don't go looking for one. */

function hasDrives(data){
  if(modalData.kind!=='football')return false;
  const d=data.drives;
  return !!((data.winprobability&&data.winprobability.length)||(d&&(d.current||(d.previous&&d.previous.length))));
}
/* Every drive, oldest first, with the in-progress one last.
   ESPN already includes the in-progress drive as the last entry of `previous`, so
   appending `current` blindly renders it twice. Dedupe by id and let `current` win,
   since it's the copy that keeps updating. */
function allDrives(data){
  const d=data.drives||{};
  const out=[],seen={};
  (d.previous||[]).forEach(x=>{if(x){seen[String(x.id)]=out.length;out.push(x);}});
  if(d.current){
    const k=String(d.current.id),i=seen[k];
    if(i!==undefined)out[i]=d.current; else out.push(d.current);
  }
  return out;
}
/* Ball position as a 0..100 fraction of the field, offense always attacking right.
   yardsToEndzone is the only field-position value that doesn't depend on knowing
   whose side of the field you're on, so prefer it and treat yardLine as a fallback. */
function ballPct(sp){
  if(!sp)return null;
  const y=sp.yardsToEndzone;
  if(y===undefined||y===null||isNaN(+y))return null;
  return Math.max(0,Math.min(100,100-(+y)));
}
function driveSpan(dr){
  const ps=(dr&&dr.plays)||[];
  if(!ps.length)return null;
  const a=ballPct(ps[0].start);
  let b=null;
  for(let i=ps.length-1;i>=0&&b===null;i--)b=ballPct(ps[i].end);
  if(a===null&&b===null)return null;
  const lo=a===null?b:a,hi=b===null?a:b;
  return {from:lo,to:hi};
}
function downDistance(sp){
  if(!sp)return '';
  if(sp.shortDownDistanceText)return sp.shortDownDistanceText;
  const ord=['','1st','2nd','3rd','4th'][sp.down];
  if(!ord||sp.distance===undefined||sp.distance===null)return '';
  return ord+' & '+(+sp.distance===0?'Goal':sp.distance);
}
/* team id -> {abbr,color} from the header competitors. ESPN gives colors as bare
   hex with no '#', and omits them for some teams, so guard both. */
/* End zone labels sit on a team's own brand colour, which is arbitrary external
   data — a theme token can't be guaranteed to contrast with it (white on the
   Chargers' powder blue is fine; white on a gold or white primary is not). This is
   the one place a literal colour is correct: it's computed from the fill, not chosen
   as a design value. sRGB relative luminance, per WCAG. */
function onColor(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m)return '#fff';
  const n=parseInt(m[1],16);
  const ch=[(n>>16)&255,(n>>8)&255,n&255].map(v=>{
    const c=v/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  });
  const L=0.2126*ch[0]+0.7152*ch[1]+0.0722*ch[2];
  return L>0.45?'#000':'#fff';
}
function teamColors(data){
  const m={},comp=data.header&&data.header.competitions&&data.header.competitions[0];
  ((comp&&comp.competitors)||[]).forEach(c=>{
    const t=c.team||{};
    let col=t.color||'';
    if(col&&!/^#/.test(col))col='#'+col;
    m[String(t.id)]={abbr:t.abbreviation||'',color:/^#[0-9a-fA-F]{3,8}$/.test(col)?col:'',homeAway:c.homeAway};
  });

}
/* scoringPlays[].id matches a play id inside a drive, so a drive's score can be
   named without re-deriving it. The text reads "Jordan Watkins 17 Yd pass from
   Adrian Martinez (Eddy Pineiro Kick)" — the scorer is everything before the
   yardage. On a defensive or return score the scorer is NOT on the drive's team,
   which is correct and worth showing. */
function scorerOf(dr,byPlayId){
  for(const pl of (dr&&dr.plays)||[]){
    const sp=byPlayId[String(pl.id)];
    if(!sp)continue;
    const txt=sp.text||'';
    const m=txt.match(/^([^0-9]+?)\s+\d/);
    const who=m?m[1].trim():'';
    if(who)return who;
  }
  return '';
}
function scoringByPlayId(data){

function wpPct(v){

/* 100-yard field with end zones, showing the most recent play: where the ball
   started, where it ended, and the line to gain. */
/* The field always shows the offense attacking right, so the end zone on the right
   is the one being attacked. Colour it with the defending team and the left one with
   the offense, and label both — colour alone is ambiguous once possession flips. */
function fieldHTML(play,offenseId,cols){
  if(!play)return '';
  const a=ballPct(play.start),b=ballPct(play.end);
  if(a===null&&b===null)return '';
  const EZ=8,FW=100-EZ*2;
  const px=p=>EZ+(p/100)*FW;
  const to=b===null?a:b,from=a===null?to:a;
  const dist=play.start&&play.start.distance;
  const fd=(play.start&&play.start.down&&dist!==undefined&&dist!==null&&a!==null)?Math.min(100,a+(+dist)):null;

  const ids=Object.keys(cols||{});
  const off=cols&&cols[String(offenseId)];
  const defId=ids.find(k=>k!==String(offenseId));
  const def=defId?cols[defId]:null;
  const ezFill=t=>t&&t.color?' style="fill:'+esc(t.color)+'"':'';

  let g='';
  for(let i=5;i<100;i+=5)g+='<line class="'+(i%10===0?'yd5':'yd')+'" x1="'+px(i).toFixed(2)+'" y1="0" x2="'+px(i).toFixed(2)+'" y2="100"/>';
  if(fd!==null)g+='<line class="fd" x1="'+px(fd).toFixed(2)+'" y1="0" x2="'+px(fd).toFixed(2)+'" y2="100"/>';
  if(a!==null)g+='<line class="los" x1="'+px(a).toFixed(2)+'" y1="0" x2="'+px(a).toFixed(2)+'" y2="100"/>';

  let lab='';
  for(let i=10;i<=90;i+=10)lab+='<span class="fnum" style="left:'+px(i).toFixed(2)+'%">'+(i<=50?i:100-i)+'</span>';
  const ezLab=(t,leftPct)=>t&&t.abbr?'<span class="fez" style="left:'+leftPct+'%;color:'+onColor(t.color)+'">'+esc(t.abbr)+'</span>':'';

  // Data attributes drive the animation: the ball mounts at `from` and the wiring
  // moves it to `to` on the next frame, so the play draws itself.
  const moved=a!==null&&b!==null&&Math.abs(b-a)>0.4;
  const lo=Math.min(from,to),hi=Math.max(from,to);
  return '<div class="fieldwrap"><div class="field" data-from="'+from.toFixed(2)+'" data-to="'+to.toFixed(2)+'" data-play="'+esc(play.id||'')+'">'+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
      '<rect class="ez" x="0" y="0" width="'+EZ+'" height="100"'+ezFill(off)+'/>'+
      '<rect class="ez" x="'+(100-EZ)+'" y="0" width="'+EZ+'" height="100"'+ezFill(def)+'/>'+g+
    '</svg>'+lab+ezLab(off,(EZ/2).toFixed(1))+ezLab(def,(100-EZ/2).toFixed(1))+
    (moved?'<div class="fgain'+(to<from?' neg':'')+'" data-lo="'+lo.toFixed(2)+'" data-hi="'+hi.toFixed(2)+'" style="left:'+px(from).toFixed(2)+'%;width:0%"></div>':'')+
    '<div class="fball" style="left:'+px(from).toFixed(2)+'%"></div>'+
  '</div></div>';
}
/* Mount the ball at the play's start, then move it to the end on the next frame.
   Guarded by play id so re-rendering for an unrelated reason (expanding a drive,
   a refresh with no new play) doesn't replay the animation. */
let wpSeries=[],wpTeams={home:'HOME',away:'AWAY'};
/* Hover anywhere on the chart to read the win probability at that point in the game,
   with the play that produced it. Pointer events cover mouse and touch alike. */
function wireWpHover(){
  const box=document.querySelector('.wpbox');
  if(!box||!wpSeries.length)return;
  const hit=box.querySelector('.wphit'),cur=box.querySelector('.wpcur'),
        mark=box.querySelector('.wpmark'),tip=box.querySelector('.wptip');
  const svg=box.querySelector('.wpchart');
  const show=e=>{
    const r=box.getBoundingClientRect();
    if(!r.width)return;
    const fx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const i=Math.round(fx*(wpSeries.length-1));
    const d=wpSeries[i];
    if(!d)return;
    const lx=(wpSeries.length<2?0:i/(wpSeries.length-1))*r.width;
    const sh=svg.getBoundingClientRect().height;
    const ly=(1-Math.max(0,Math.min(1,d.p)))*sh;
    cur.style.display='block';cur.style.left=lx.toFixed(1)+'px';
    mark.style.display='block';mark.style.left=lx.toFixed(1)+'px';mark.style.top=ly.toFixed(1)+'px';
    const when=[d.per?'Q'+d.per:'',d.clock].filter(Boolean).join(' ');
    tip.innerHTML='<div class="t">'+esc(when||'\u2014')+'</div>'+
      '<div class="v"><b>'+esc(wpPct(d.p))+'</b> '+esc(wpTeams.home)+
      '  \u00b7  '+esc(wpPct(1-d.p))+' '+esc(wpTeams.away)+'</div>'+
      (d.text?'<div class="p">'+esc(d.text)+'</div>':'');
    tip.style.display='block';
    // Keep the tooltip inside the chart box. A high win probability puts the point
    // near the top, where the default "above the point" placement would cover the
    // header, so flip it below when there isn't room.
    const tw=tip.offsetWidth,th=tip.offsetHeight,half=tw/2;
    const below=ly-th-10<0;
    tip.style.transform='translate(-50%,'+(below?'0':'-100%')+')';
    tip.style.marginTop=(below?12:-10)+'px';
    tip.style.left=Math.max(half+2,Math.min(r.width-half-2,lx)).toFixed(1)+'px';
    tip.style.top=ly.toFixed(1)+'px';
  };
  const hide=()=>{cur.style.display='none';mark.style.display='none';tip.style.display='none';};
  hit.onpointermove=show;
  hit.onpointerdown=show;
  hit.onpointerleave=hide;
  hit.onpointercancel=hide;
}
/* The global auto-refresh deliberately never fires while a modal is open (it used to
   yank you out of a player profile). The Drive tab is the one place that genuinely
   needs to keep moving, so it runs its own timer — scoped to this tab, this game,
   and only while the game is actually in progress. It re-renders the tab body in
   place, preserving scroll position and which drive is expanded.
   20s: plays land ~30-45s after they happen, so polling faster only burns requests. */
const DRIVE_REFRESH_MS=20000;
let driveTimer=null;
function gameLive(){
  const c=modalData&&modalData.data&&modalData.data.header&&modalData.data.header.competitions;
  const st=c&&c[0]&&c[0].status&&c[0].status.type;
  return !!(st&&st.state==='in');
}
function stopDriveRefresh(){if(driveTimer){clearInterval(driveTimer);driveTimer=null;}}
function startDriveRefresh(){
  stopDriveRefresh();
  if(modalTab!=='drive'||!modalData||!modalData.id||!gameLive())return;
  driveTimer=setInterval(refreshDrive,DRIVE_REFRESH_MS);
}
async function refreshDrive(){
  if(modalTab!=='drive'||!modalData||!modalData.id||!$('#backdrop').classList.contains('open')){stopDriveRefresh();return;}
  let d;
  try{d=await get(API+'/'+modalData.path+'/summary?event='+modalData.id);}
  catch(e){return;}                       // a dropped poll is not worth disturbing the view over
  if(modalTab!=='drive'||!modalData)return;
  modalData.data=d;
  const body=$('#mbody');
  const top=body?body.scrollTop:0;
  drawModalBody();
  const nb=$('#mbody');
  if(nb)nb.scrollTop=top;
  if(!gameLive())stopDriveRefresh();      // game just ended - stop polling
}
let lastAnimPlay=null;
function animateField(){

  const ball=f.querySelector('.fball'),bar=f.querySelector('.fgain');
  const replay=id&&id!==lastAnimPlay;
  if(!replay){
    if(ball)ball.style.transition='none',ball.style.left=px(to).toFixed(2)+'%';
    if(bar){bar.style.transition='none';bar.style.left=px(+bar.dataset.lo).toFixed(2)+'%';
            bar.style.width=(px(+bar.dataset.hi)-px(+bar.dataset.lo)).toFixed(2)+'%';}

  }

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(ball)ball.style.left=px(to).toFixed(2)+'%';
    if(bar){bar.style.left=px(+bar.dataset.lo).toFixed(2)+'%';
            bar.style.width=(px(+bar.dataset.hi)-px(+bar.dataset.lo)).toFixed(2)+'%';}

let tickerSig='';const TICKER_SPEED=60;
function paintTicker(items){
  const el=$('#tick');
  if(items===tickerSig)return;tickerSig=items;
  if(!items){el.classList.add('paused');el.style.animationDuration='0s';
    el.innerHTML='<div class="tk-seq"><span class="tk-item">No games right now</span></div>';return;}
  el.classList.remove('paused');
  el.innerHTML='<div class="tk-seq">'+items+'</div>';
  requestAnimationFrame(()=>{
    const one=el.firstElementChild,w=one?one.offsetWidth:0;
    if(!w){el.innerHTML='<div class="tk-seq">'+items+'</div><div class="tk-seq">'+items+'</div>';return;}
    const reps=Math.max(1,Math.ceil((window.innerWidth+200)/w));
    let inner='';for(let i=0;i<reps;i++)inner+=items;
    el.innerHTML='<div class="tk-seq">'+inner+'</div><div class="tk-seq">'+inner+'</div>';
    el.style.animationDuration=Math.max(18,(w*reps)/TICKER_SPEED)+'s';
  });
}

/* ========================= GOLF ========================= */
// Golf is a leaderboard, not two teams, so it gets its own renderer rather than
// reusing gameCard(). Competitor.id is the athlete id, so names open the usual profile.
// Leaderboard positions with ties: players sharing a score all get the same rank,
// prefixed T. ESPN leaves status.position empty on finished events, so derive it.
function golfPositions(cs){
  const out=[],n=cs.length;
  for(let i=0;i<n;i++){
    if(cs[i].score===undefined||cs[i].score===null){out.push('');continue;}
    let first=i;while(first>0&&cs[first-1].score===cs[i].score)first--;
    let last=i;while(last<n-1&&cs[last+1].score===cs[i].score)last++;
    out.push((last>first?'T':'')+(first+1));
  }
  return out;
}
/* Course card, live weather, purse and defending champion live on the CORE api, not
   the site scoreboard the leaderboard comes from. `courses[0].holes[]` carries par
   and yardage per hole — real geometry, so hole difficulty needs no third-party
   course data. Cached per event: it changes at most once a round. */
let golfCourse=null,golfCourseFor=null;
async function ensureGolfCourse(evId){
  if(golfCourseFor===evId)return golfCourse;
  try{
    const d=await get(CORE+'/sports/golf/leagues/'+golfTour+'/events/'+evId);
    golfCourse={course:(d.courses||[])[0]||null,purse:d.displayPurse||'',
      champ:(d.defendingChampion&&d.defendingChampion.athlete&&d.defendingChampion.athlete.displayName)||'',
      playoff:!!d.isCupPlayoff};
  }catch(e){golfCourse=null;}                 // header detail is a bonus, never a blocker
  golfCourseFor=evId;
  return golfCourse;
}
// par per hole, keyed by hole number
function golfPars(gc){
  const m={};
  ((gc&&gc.course&&gc.course.holes)||[]).forEach(h=>{
    if(h&&h.number!==undefined)m[h.number]={par:h.shotsToPar,yards:h.totalYards};
  });
  return m;
}
/* Hole-by-hole scoring is a PGA / Korn Ferry thing. DP World, LPGA, LIV and Champions
   publish round totals only, so anything hole-level must degrade rather than break. */
function holeEntries(r){return (((r&&r.linescores)||[]).filter(h=>h&&h.value));}
function hasHoleData(cs){return cs.some(c=>(c.linescores||[]).some(r=>holeEntries(r).length>0));}
// Holes played in a round. With no hole detail, a round carrying a score is a finished one.
function playedIn(r){
  const h=holeEntries(r).length;
  if(h)return h;
  return (r&&r.value)?18:0;
}
// Rounds that actually have scores. ESPN pads `linescores` with an empty entry for
// the next round, so a tournament in round 2 reports three.
function activeRounds(cs){
  let n=0;
  cs.forEach(c=>(c.linescores||[]).forEach((r,i)=>{
    if(r&&(r.value||(r.linescores||[]).some(h=>h&&h.value)))n=Math.max(n,i+1);
  }));
  return n;
}
// holes posted in a player's current round — ESPN has no `thru` on the scoreboard
function golfThru(c){
  const ls=c.linescores||[];
  for(let i=ls.length-1;i>=0;i--){
    const n=playedIn(ls[i]);
    if(n)return {round:i+1,holes:n,complete:n>=18};
  }
  return null;
}
function scoreClass(strokes,par){
  if(!strokes||!par)return 'sc';
  const d=strokes-par;
  return d<=-2?'eag':d===-1?'bir':d===0?'sc':d===1?'bog':'dbl';
}
/* Field-wide hole difficulty: average strokes over par across everyone who has
   posted the hole. Real derived analytics from free data — no modelling, no
   fabrication. Needs par from the course card, since the scoreboard omits it. */
function holeDifficulty(cs,pars,roundOnly){
  const agg={};
  cs.forEach(c=>{
    (c.linescores||[]).forEach((rnd,ri)=>{
      if(roundOnly!==undefined&&ri!==roundOnly)return;
      (rnd.linescores||[]).forEach(h=>{
        const p=pars[h.period];
        if(!p||!h.value)return;
        (agg[h.period]=agg[h.period]||[]).push(h.value-p.par);
      });
    });
  });
  return Object.keys(agg).map(k=>{
    const v=agg[k];
    return {hole:+k,par:pars[k].par,yards:pars[k].yards,
            avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length};
  }).sort((a,b)=>a.hole-b.hole);
}
/* Position now vs position through the previous round. Golf leaderboards are inert
   without this — it's the only thing that shows who is actually moving today.
   Must rank by score TO PAR, never by cumulative strokes: mid-round, a player three
   holes into their round has more strokes than one who hasn't teed off, so ranking
   by strokes buries everyone currently on the course. */
function toPar(v){
  if(v===undefined||v===null||v==='')return null;
  const t=String(v).trim();
  if(t==='E'||t==='e')return 0;
  const n=parseFloat(t.replace('+',''));
  return isNaN(n)?null:n;
}
function golfMovers(cs){
  const rounds=activeRounds(cs);
  if(rounds<2)return [];
  // cumulative to-par through round index `upto`
  const cum=(c,upto)=>{
    let sum=0,any=false;
    (c.linescores||[]).forEach((r,i)=>{
      if(i>upto)return;
      if(!playedIn(r))return;
      const v=toPar(r.displayValue);
      if(v!==null){sum+=v;any=true;}
    });
    return any?sum:null;
  };
  // tie-aware: players on the same score share the better position
  const rank=upto=>{
    const list=cs.map(c=>({id:c.id,t:cum(c,upto)})).filter(x=>x.t!==null).sort((a,b)=>a.t-b.t);
    const m={};
    list.forEach((x,i)=>{
      if(i>0&&list[i-1].t===x.t)m[x.id]=m[list[i-1].id];
      else m[x.id]=i+1;
    });
    return m;
  };
  const before=rank(rounds-2),now=rank(rounds-1);
  return cs.map(c=>{
    const b=before[c.id],n=now[c.id];
    const today=(c.linescores||[])[rounds-1];
    const played=today?playedIn(today):0;
    return {c:c,before:b,now:n,delta:(b&&n)?b-n:null,played:played,
            todayScore:today?today.displayValue:null};
  }).filter(x=>x.delta!==null&&x.played>0);   // only players actually out there today
}

async function renderGolf(){
  const box=$('#main');
  box.innerHTML='<div class="controls"><div class="chips">'+
    GOLF_TOURS.map(t=>'<button class="chip '+(golfTour===t[0]?'on':'')+'" data-gt="'+t[0]+'">'+esc(t[1])+'</button>').join('')+
    '</div></div><div id="golfBody"><div class="msg">Loading…</div></div>';
  document.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{golfTour=b.dataset.gt;golfTab='board';golfOpen=null;renderGolf();});
  const body=$('#golfBody');
  try{
    const d=await get(API+'/golf/'+golfTour+'/scoreboard');
    const ev=(d.events||[])[0];
    if(!ev){body.innerHTML='<div class="msg">No tournament listed for this tour.</div>';return;}
    golfData=ev;
    await ensureGolfCourse(ev.id);
    drawGolf();
  }catch(e){body.innerHTML='<div class="msg err">Couldn\'t load the leaderboard.</div>';}
}

/* Re-pull the leaderboard in place. Keeps the sub-tab, the expanded player and the
   scroll position, so a refresh mid-tournament doesn't yank the view around. The
   course card is cached separately and doesn't need re-fetching. */
async function refreshGolf(){
  if(view!=='golf'||!golfData)return;
  let d;
  try{d=await get(API+'/golf/'+golfTour+'/scoreboard');}catch(e){return;}
  if(view!=='golf')return;
  const ev=(d.events||[])[0];
  if(!ev)return;
  const y=window.scrollY,open=golfOpen;
  golfData=ev;
  drawGolf();
  window.scrollTo(0,y);
  if(open)loadGolfStats(open);
}
function drawGolf(){
  const body=$('#golfBody');
  if(!body||!golfData)return;
  const ev=golfData;
  const comp=(ev.competitions||[])[0]||{},cs=comp.competitors||[];
  const st=(ev.status&&ev.status.type&&ev.status.type.description)||'';
  const when=ev.date?new Date(ev.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  const endW=ev.endDate?new Date(ev.endDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  const gc=golfCourse,course=gc&&gc.course,wx=course&&course.weather;
  const pars=golfPars(gc);

  let html='<div class="grouplabel">'+esc(ev.name||'')+'</div>'+
    '<div class="sublabel">'+esc([when&&endW&&when!==endW?when+' – '+endW:when,st].filter(Boolean).join('  ·  '))+'</div>';

  // header strip: course, par/yardage, wind, purse
  if(course||wx){
    const bits=[];
    if(course&&course.name)bits.push(['Course',course.name]);
    if(course&&course.shotsToPar)bits.push(['Par',course.shotsToPar+(course.totalYards?'  ·  '+Number(course.totalYards).toLocaleString()+' yds':'')]);
    if(wx&&wx.temperature!==undefined)bits.push(['Conditions',wx.temperature+'°  '+esc(wx.conditionId||'')]);
    if(wx&&wx.windSpeed!==undefined)bits.push(['Wind',wx.windSpeed+' mph '+(wx.windDirection||'')+(wx.gust?'  (G '+wx.gust+')':''),true]);
    if(gc&&gc.purse)bits.push(['Purse',gc.purse]);
    if(gc&&gc.champ)bits.push(['Defending',gc.champ]);
    html+='<div class="ghead">'+bits.map(b=>'<span class="gitem'+(b[2]?' gwx':'')+'">'+esc(b[0])+'<b>'+esc(b[1])+'</b></span>').join('')+'</div>';
  }

  const tabs=[['board','Leaderboard'],['course','Course'],['today','Today']];
  html+='<div class="gtabs">'+
    tabs.map(t=>'<button class="'+(golfTab===t[0]?'on':'')+'" data-gsec="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';

  if(!cs.length)html+='<div class="msg">Field not published yet.</div>';
  else if(golfTab==='course')html+=golfCourseHTML(cs,pars);
  else if(golfTab==='today')html+=golfTodayHTML(cs);
  else html+=golfBoardHTML(cs,pars);

  body.innerHTML=html;
  document.querySelectorAll('[data-gsec]').forEach(b=>b.onclick=()=>{golfTab=b.dataset.gsec;golfOpen=null;drawGolf();});
  document.querySelectorAll('[data-gid]').forEach(r=>r.onclick=()=>{
    const id=r.dataset.gid;
    golfOpen=(golfOpen===id)?null:id;
    drawGolf();
    if(golfOpen)loadGolfStats(golfOpen);
  });
  document.querySelectorAll('[data-gprof]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();openPlayer(b.dataset.gprof,'golf/'+golfTour);
  });
}

function golfBoardHTML(cs,pars){
  const rounds=activeRounds(cs);
  const pos=golfPositions(cs);
  const hasPars=Object.keys(pars).length>0,hasHole=hasHoleData(cs);
  return '<div class="sublabel">Tap a player for their scorecard and round stats</div>'+
    '<div class="tscroll"><table class="st"><thead><tr><th>Pos</th><th style="text-align:left">Player</th>'+
    '<th>Total</th><th>Thru</th>'+Array.from({length:rounds},(_,i)=>'<th>R'+(i+1)+'</th>').join('')+
    '</tr></thead><tbody>'+cs.map((c,ci)=>{
      const a=c.athlete||{},ls=c.linescores||[];
      const flag=(a.flag&&a.flag.href)||'';
      const sc=(c.score===0||c.score==='0')?'E':(c.score===undefined||c.score===null?'':c.score);
      const th=golfThru(c);
      const thru=!th?'':(th.holes===0?'—':th.holes>=18?'F':String(th.holes));
      const open=golfOpen===String(c.id);
      let row='<tr'+(c.id?' data-gid="'+esc(c.id)+'" class="'+(open?'gopen':'')+'" style="cursor:pointer"':'')+'>'+
        '<td>'+esc(pos[ci])+'</td>'+
        '<td style="text-align:left"><span class="gcar">\u203a</span>'+(flag?'<img src="'+esc(flag)+'" alt="" style="width:14px;height:10px;object-fit:cover;margin-right:6px;vertical-align:middle" onerror="this.style.display=\'none\'">':'')+
          esc(a.displayName||a.fullName||'')+'</td>'+
        '<td style="color:var(--accent);font-weight:600">'+esc(sc)+'</td>'+
        '<td style="color:var(--dim-2);font-family:\'Roboto Mono\',monospace;font-size:10.5px">'+esc(thru)+'</td>'+
        Array.from({length:rounds},(_,i)=>{
          const r=ls[i]||{};
          const played=playedIn(r);
          if(!played)return '<td></td>';
          // A round in progress carries running strokes (10 after 3 holes), which reads
          // as a score. Show the to-par instead until the round is complete.
          if(played<18)return '<td style="color:var(--accent)">'+esc(r.displayValue||'')+'</td>';
          return '<td>'+esc(r.value!==undefined&&r.value!==null?Math.round(r.value):(r.displayValue||''))+'</td>';
        }).join('')+'</tr>';
      if(open)row+='<tr class="gexp"><td colspan="'+(4+rounds)+'"><div class="gwrap" id="gx-'+esc(c.id)+'">'+
        (!hasHole?'<div class="msg">ESPN doesn\'t publish hole-by-hole scoring for this tour \u2014 only round totals.</div>':
          hasPars?golfScorecardHTML(c,pars):'<div class="msg">Course card unavailable, so holes can\'t be scored against par.</div>')+
        '<div class="gstat" id="gs-'+esc(c.id)+'"><span>Loading round stats…</span></div>'+
        '</div></td></tr>';
      return row;
    }).join('')+'</tbody></table></div>';
}

/* Hole-by-hole card, out/in split, colour-coded against par. Scores come from the
   scoreboard the leaderboard already loaded; par comes from the course card. */
function golfScorecardHTML(c,pars){
  const ls=c.linescores||[];
  if(!ls.length)return '<div class="msg">No rounds posted yet.</div>';
  const nums=[];for(let i=1;i<=18;i++)nums.push(i);
  const head='<tr><th class="lbl">Hole</th>'+nums.slice(0,9).map(n=>'<th>'+n+'</th>').join('')+
    '<th class="tot">OUT</th>'+nums.slice(9).map(n=>'<th>'+n+'</th>').join('')+'<th class="tot">IN</th><th class="tot">TOT</th></tr>';
  const parRow='<tr><td class="lbl">Par</td>'+nums.slice(0,9).map(n=>'<td class="sc">'+(pars[n]?pars[n].par:'')+'</td>').join('')+
    '<td class="tot">'+nums.slice(0,9).reduce((a,n)=>a+((pars[n]&&pars[n].par)||0),0)+'</td>'+
    nums.slice(9).map(n=>'<td class="sc">'+(pars[n]?pars[n].par:'')+'</td>').join('')+
    '<td class="tot">'+nums.slice(9).reduce((a,n)=>a+((pars[n]&&pars[n].par)||0),0)+'</td>'+
    '<td class="tot">'+nums.reduce((a,n)=>a+((pars[n]&&pars[n].par)||0),0)+'</td></tr>';
  const rows=ls.map((rnd,ri)=>{
    const by={};(rnd.linescores||[]).forEach(h=>{by[h.period]=h.value;});
    if(!Object.keys(by).length)return '';   // round not started; ESPN pads these
    const sum=hs=>{let t=0,any=false;hs.forEach(n=>{if(by[n]){t+=by[n];any=true;}});return any?t:'';};
    const cell=n=>{
      const v=by[n];
      if(!v)return '<td class="sc">·</td>';
      return '<td class="'+scoreClass(v,pars[n]&&pars[n].par)+'">'+v+'</td>';
    };
    return '<tr><td class="lbl">R'+(ri+1)+'</td>'+nums.slice(0,9).map(cell).join('')+
      '<td class="tot">'+sum(nums.slice(0,9))+'</td>'+nums.slice(9).map(cell).join('')+
      '<td class="tot">'+sum(nums.slice(9))+'</td><td class="tot">'+sum(nums)+'</td></tr>';
  }).join('');
  return '<div><table class="gsc"><thead>'+head+'</thead><tbody>'+parRow+rows+'</tbody></table></div>';
}

/* Round stats are only on the playersummary endpoint, so they're fetched lazily when
   a row is expanded rather than 50x up front. */
async function loadGolfStats(id){
  const el=document.getElementById('gs-'+id);
  if(!el)return;
  // On rate stats a 0 means "not reported", not a real value. On counting stats it's
  // real, but a row of zeroes is noise, so those are dropped too.
  const RATE={driveDistAvg:1,driveAccuracyPct:1,gir:1,puttsGirAvg:1,sandSaves:1};
  const WANT=[['driveDistAvg','Drive'],['driveAccuracyPct','Fairways %'],['gir','GIR %'],
    ['puttsGirAvg','Putts/GIR'],['sandSaves','Sand save %'],['eagles','Eagles'],
    ['birdies','Birdies'],['pars','Pars'],['bogeys','Bogeys'],['doubleBogeysAndWorse','DBL+'],
    ['penalties','Penalties']];
  try{
    const d=await get(WEBSITE+'/golf/'+golfTour+'/leaderboard/'+golfData.id+'/playersummary?player='+id);
    const by={};(d.stats||[]).forEach(x=>{if(x&&x.name)by[x.name]=x.displayValue;});
    const out=WANT.filter(w=>{
        const v=by[w[0]];
        if(v===undefined||v==='')return false;
        const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
        return isFinite(n)&&n!==0;      // "-" and 0 both mean "not reported" here
      })
      .map(w=>'<span>'+esc(w[1])+'<b>'+esc(by[w[0]])+'</b></span>').join('');
    if(document.getElementById('gs-'+id))
      document.getElementById('gs-'+id).innerHTML=(out||'<span>No round stats posted yet.</span>')+
        '<span style="margin-left:auto"><button class="chip" data-gprof="'+esc(id)+'" style="padding:2px 9px;font-size:10px">Full profile</button></span>';
    document.querySelectorAll('[data-gprof]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();openPlayer(b.dataset.gprof,'golf/'+golfTour);
    });
  }catch(e){
    const t=document.getElementById('gs-'+id);
    if(t)t.innerHTML='<span>Round stats unavailable for this player.</span>';
  }
}

function golfCourseHTML(cs,pars){
  if(!Object.keys(pars).length)return '<div class="msg">Course card unavailable for this event.</div>';
  if(!hasHoleData(cs))return golfCardOnlyHTML(pars);
  const rows=holeDifficulty(cs,pars);
  if(!rows.length)return '<div class="msg">No holes posted yet \u2014 difficulty appears once scores are in.</div>';
  const max=Math.max.apply(null,rows.map(r=>Math.abs(r.avg)).concat([0.01]));
  const ranked=rows.slice().sort((a,b)=>b.avg-a.avg);
  const rankOf={};ranked.forEach((r,i)=>{rankOf[r.hole]=i+1;});
  return '<div class="sublabel">Hole difficulty — field average vs par, all rounds (rank 1 = hardest)</div>'+
    '<div class="tscroll"><table class="st"><thead><tr><th>Hole</th><th>Par</th><th>Yards</th>'+
    '<th>Avg vs par</th><th>Harder \u2190 \u2192 Easier</th><th>Rank</th><th>Players</th></tr></thead><tbody>'+
    rows.map(r=>{
      // the bar gets its own column so it can't sit under the number
      const w=(Math.abs(r.avg)/max)*48;
      const bar=Math.abs(r.avg)<0.005?'':'<span class="gbar '+(r.avg>0?'hard':'easy')+'" style="'+
        (r.avg>0?'right:50%':'left:50%')+';width:'+w.toFixed(1)+'%"></span>';
      return '<tr><td>'+r.hole+'</td><td>'+r.par+'</td><td>'+(r.yards||'')+'</td>'+
        '<td class="gdiff" style="color:var(--'+(r.avg>0?'loss':(r.avg<0?'win':'dim-2'))+')">'+
        (r.avg>0?'+':'')+r.avg.toFixed(3)+'</td>'+
        '<td class="ghole">'+bar+'</td>'+
        '<td>'+rankOf[r.hole]+'</td><td style="color:var(--dim-2)">'+r.n+'</td></tr>';
    }).join('')+'</tbody></table></div>'+
    '<div class="sublabel">Hardest: '+ranked[0].hole+' ('+(ranked[0].avg>0?'+':'')+ranked[0].avg.toFixed(2)+
    ')  ·  Easiest: '+ranked[ranked.length-1].hole+' ('+ranked[ranked.length-1].avg.toFixed(2)+')</div>';
}

/* No field hole-scoring on this tour, but the course card is real and still useful:
   par and yardage per hole, out/in totals. */
function golfCardOnlyHTML(pars){
  const nums=[];for(let i=1;i<=18;i++)if(pars[i])nums.push(i);
  if(!nums.length)return '<div class="msg">Course card unavailable for this event.</div>';
  const sum=(f,l)=>nums.filter(n=>n>=f&&n<=l).reduce((a,n)=>a+(pars[n].par||0),0);
  const yds=(f,l)=>nums.filter(n=>n>=f&&n<=l).reduce((a,n)=>a+(pars[n].yards||0),0);
  return '<div class="msg">ESPN doesn\'t publish hole-by-hole scoring for this tour \u2014 only round totals.</div>'+
    '<div class="sublabel">Course card</div><div class="tscroll"><table class="st"><thead><tr>'+
    '<th>Hole</th><th>Par</th><th>Yards</th></tr></thead><tbody>'+
    nums.map(n=>'<tr><td>'+n+'</td><td>'+pars[n].par+'</td><td>'+(pars[n].yards||'')+'</td></tr>').join('')+
    '<tr><td><b>OUT</b></td><td><b>'+sum(1,9)+'</b></td><td><b>'+yds(1,9)+'</b></td></tr>'+
    '<tr><td><b>IN</b></td><td><b>'+sum(10,18)+'</b></td><td><b>'+yds(10,18)+'</b></td></tr>'+
    '<tr><td><b>TOTAL</b></td><td><b>'+sum(1,18)+'</b></td><td><b>'+yds(1,18)+'</b></td></tr>'+
    '</tbody></table></div>';
}
function golfTodayHTML(cs){
  const mv=golfMovers(cs);
  if(!mv.length)return '<div class="msg">Movers appear once a second round is underway.</div>';
  const up=mv.filter(m=>m.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,10);
  const dn=mv.filter(m=>m.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,10);
  const rounds=activeRounds(cs);
  const best=cs.map(c=>({c:c,r:(c.linescores||[])[rounds-1]}))
    .filter(x=>x.r&&x.r.value&&playedIn(x.r)>=18)
    .sort((a,b)=>a.r.value-b.r.value).slice(0,10);
  const name=c=>esc((c.athlete&&(c.athlete.displayName||c.athlete.fullName))||'');
  // Show how far through the round they are: a big move from a player 3 holes in
  // is not the same story as one from a player who has signed their card.
  const mvCell=(x,dir)=>'<span class="gmove'+(dir==='dn'?' dn':'')+'">'+(dir==='dn'?'▼ ':'▲ ')+Math.abs(x.delta)+'</span>'+
    '  <span style="color:var(--dim-2)">'+x.before+' → '+x.now+'</span>'+
    '  <span style="color:var(--dim-2)">('+(x.played>=18?'F':'thru '+x.played)+
    (x.todayScore?', '+esc(x.todayScore):'')+')</span>';
  const anyDone=best.length>0;
  const tbl=(label,list,fmt)=>!list.length?'':'<div class="sublabel">'+label+'</div>'+
    '<div class="tscroll"><table class="st"><tbody>'+list.map(x=>
      '<tr><td style="text-align:left">'+name(x.c)+'</td><td style="text-align:right">'+fmt(x)+'</td></tr>').join('')+
    '</tbody></table></div>';
  return (anyDone?tbl('Best round today',best,x=>'<b style="color:var(--accent)">'+esc(x.r.displayValue||x.r.value)+'</b>')
                 :'<div class="sublabel">Best round today</div><div class="msg">Nobody has finished the round yet.</div>')+
    tbl('Moving up',up,x=>mvCell(x,'up'))+
    tbl('Sliding back',dn,x=>mvCell(x,'dn'));
}

function render(){
  if(view==='scores'){renderScoresShell();loadScores();}
  else if(view==='calendar')renderCalendar();
  else if(view==='teams')renderTeamsShell();
  else if(view==='golf')renderGolf();
  else loadF1();
}
$('#cfgBtn').onclick=()=>{showCfg=!showCfg;
  if(view!=='scores'&&VIEW_ORDER.indexOf('scores')>=0){view='scores';saveLastView();markNav();}
  render();};
$('#refresh').onclick=()=>{render();loadTicker();stamp();};
$('#autoBtn').onclick=()=>{autoRefresh=!autoRefresh;
  $('#autoBtn').textContent='Auto-refresh: '+(autoRefresh?'on':'off');
  $('#autoBtn').classList.toggle('on',autoRefresh);};
$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal();};
$('#pbackdrop').onclick=e=>{if(e.target.id==='pbackdrop')closePlayer();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#pbackdrop').classList.contains('open'))closePlayer();else closeModal();return;}
  if(view!=='scores'||modalOpen()||liveMode)return;
  const t=document.activeElement&&document.activeElement.tagName;
  if(t==='INPUT'||t==='SELECT')return;
  if(e.key==='ArrowLeft'){dateObj.setDate(dateObj.getDate()-(weekMode?7:1));renderScoresShell();loadScores();}
  if(e.key==='ArrowRight'){dateObj.setDate(dateObj.getDate()+(weekMode?7:1));renderScoresShell();loadScores();}});

clock();setInterval(clock,30000);
initSettings();
renderNav();
render();loadTicker();stamp();
setInterval(()=>{
  if(!autoRefresh||modalOpen())return;
  if(view==='scores'){loadScores();loadTicker();return;}
  if(view==='golf')refreshGolf();
},60000);
